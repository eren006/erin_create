# 版本更新记录：
# 2.5.1：重做地牢（星露谷矿井风格：分层下探+电梯存档点+回合制战斗）；修了偷菜/送礼@到人没反应的 bug。
# 2.6.0：新增宠物系统——领养猫/狗，撸猫/遛狗（免费，有冷却）或喂宠物（花钱，每天限一次）攒幸福度，
#        幸福度越高被动加成越强：猫降低被偷菜成功率，狗降低钓鱼空军率。
# 2.7.0：新增4种隐藏变异作物——种下对应的原型作物时才有极小概率被发现，解锁后永久可种，杂货店
#        买不到，配了4道对应的高价值菜谱；新增「一键种地」，一次性付费解锁后能把当季某种作物
#        一口气种满所有空地。
# 2.8.0：新增「每日委托」——每天一个"上缴N份原料"的委托，看仓库现存量判定，完成换一笔比直接
#        卖划算的金币；新增「温室」，Lv.20+且花3000金币解锁，不分季节、不用浇水的第二种产地。
# 2.9.0：新增技能系统——种地/养殖/钓鱼/地牢各自攒经验升到Lv.10，每级有被动加成（收菜/产出/鱼价金币、
#        变异发现概率、钓鱼空军率、地牢生命攻击），Lv.5二选一专精，「技能」查看、「选专精」选择。
format_version = "1.0.0"

[package]
id = "changri/farm"
name = "长露谷（Beta）"
version = "2.9.0"
authors = ["长日将尽"]
license = "MIT"
description = "【Beta测试版，数值/规则可能随时调整】种地(32种常规作物+4种隐藏变异作物)、浇水、养殖(鸡/羊/牛)、钓鱼、酿酒、做饭(29道菜谱)、逛商店的群互动小游戏，成就墙+家园装饰+宠物，四季日历+天气生态联动+浮动市场+节日活动+看电视解锁菜谱，一键种地，每日委托，Lv.20+可解锁温室（不分季节的第二种生产方式），四门技能升级+专精，作物/动物/酒/菜到期主动提醒，还能互相偷菜/送礼/下地牢。2.6.0版本更新了宠物系统：领养猫/狗，撸猫/遛狗/喂宠物攒幸福度，幸福度越高被动加成越强（猫降低被偷菜成功率，狗降低钓鱼空军率）。2.7.0版本更新了隐藏变异作物：种植特定作物时有极小概率解锁稀有变异种子，杂货店买不到，配套新增4道高价值菜谱；并加上了「一键种地」：一次性付费解锁后，能把当季某种作物一口气种满所有空地。2.8.0版本更新了每日委托：每天上缴指定数量的原料换金币奖励；并加上了「温室」：Lv.20以上花3000金币解锁，能不分季节、不用浇水地种作物。2.9.0版本更新了技能系统：种地/养殖/钓鱼/地牢四门技能靠日常玩法升级，每级有被动加成，Lv.5可二选一专精。"
keywords = ["娱乐", "养成", "农场", "长日将尽"]

[package.seal]
min_version = "1.5.0"

[permissions]
network = false
dangerous = false
http_server = false

[contents]
scripts = ["scripts/farm.js"]

[store]
category = "game"
