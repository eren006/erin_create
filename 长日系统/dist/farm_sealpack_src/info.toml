# 版本更新记录：
# 2.5.1：重做地牢（星露谷矿井风格：分层下探+电梯存档点+回合制战斗）；修了偷菜/送礼@到人没反应的 bug。
# 2.6.0：新增宠物系统——领养猫/狗，撸猫/遛狗（免费，有冷却）或喂宠物（花钱，每天限一次）攒幸福度，
#        幸福度越高被动加成越强：猫降低被偷菜成功率，狗降低钓鱼空军率。
format_version = "1.0.0"

[package]
id = "changri/farm"
name = "长露谷（Beta）"
version = "2.6.0"
authors = ["长日将尽"]
license = "MIT"
description = "【Beta测试版，数值/规则可能随时调整】种地(32种作物)、浇水、养殖(鸡/羊/牛)、钓鱼、酿酒、做饭(25道菜谱)、逛商店的群互动小游戏，成就墙+家园装饰+宠物，四季日历+天气生态联动+浮动市场+节日活动+看电视解锁菜谱，作物/动物/酒/菜到期主动提醒，还能互相偷菜/送礼/下地牢。2.6.0版本更新了宠物系统：领养猫/狗，撸猫/遛狗/喂宠物攒幸福度，幸福度越高被动加成越强（猫降低被偷菜成功率，狗降低钓鱼空军率）。"
keywords = ["娱乐", "养成", "农场", "长日将尽"]

[package.seal]
min_version = "1.5.0"

[permissions]
network = false
dangerous = false
http_server = false

[contents]
scripts = ["scripts/farm.js"]

[store]
category = "game"
