<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>长日将尽 · 许愿墙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#111111; --paper:#ffffff; --paper-2:#f4f3f1; --line:#e7e5e1; --muted:#6b6a67;
  --accent:#c65a2e; /* 暖赭色点缀，呼应"长日"意象 */
  --tag-feat-bg:#eef7f0; --tag-feat-fg:#1d7a44;
  --tag-fix-bg:#fdeee6; --tag-fix-fg:#b4501f;
  --tag-improve-bg:#eef1fb; --tag-improve-fg:#4247a8;
  --tag-chore-bg:#f1f0ee; --tag-chore-fg:#6b6a67;
}
@media (prefers-color-scheme: dark) {
  :root { --ink:#f2f0ec; --paper:#151412; --paper-2:#1c1a17; --line:#312e29; --muted:#a39e94;
    --tag-feat-bg:#132419; --tag-feat-fg:#7fd8a0;
    --tag-fix-bg:#2a1c12; --tag-fix-fg:#f0a874;
    --tag-improve-bg:#181a2c; --tag-improve-fg:#a9adf0;
    --tag-chore-bg:#211f1b; --tag-chore-fg:#a39e94; }
}
:root[data-theme="dark"] { --ink:#f2f0ec; --paper:#151412; --paper-2:#1c1a17; --line:#312e29; --muted:#a39e94;
    --tag-feat-bg:#132419; --tag-feat-fg:#7fd8a0;
    --tag-fix-bg:#2a1c12; --tag-fix-fg:#f0a874;
    --tag-improve-bg:#181a2c; --tag-improve-fg:#a9adf0;
    --tag-chore-bg:#211f1b; --tag-chore-fg:#a39e94; }
:root[data-theme="light"] { --ink:#111111; --paper:#ffffff; --paper-2:#f4f3f1; --line:#e7e5e1; --muted:#6b6a67;
  --accent:#c65a2e;
  --tag-feat-bg:#eef7f0; --tag-feat-fg:#1d7a44;
  --tag-fix-bg:#fdeee6; --tag-fix-fg:#b4501f;
  --tag-improve-bg:#eef1fb; --tag-improve-fg:#4247a8;
  --tag-chore-bg:#f1f0ee; --tag-chore-fg:#6b6a67; }

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Manrope","PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.7;}
h1,h2,h3{font-family:"Manrope","PingFang SC","Microsoft YaHei",sans-serif;}
a{color:inherit;}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px;}

/* ---------- 顶部导航 ---------- */
.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);}
:root[data-theme="dark"] .nav, @media (prefers-color-scheme:dark){.nav{background:rgba(21,20,18,.86);}}
.nav-inner{max-width:1080px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;letter-spacing:.02em;white-space:nowrap;}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
.nav-links{display:flex;gap:26px;font-size:13.5px;font-weight:700;color:var(--muted);}
.nav-links a{text-decoration:none;cursor:pointer;}
.nav-links a:hover,.nav-links a.active{color:var(--ink);}
.nav-meta{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.4;white-space:nowrap;}

/* ---------- 英雄区 ---------- */
.hero{position:relative;background:var(--ink);color:#f5f2ec;overflow:hidden;border-radius:0 0 28px 28px;}
.hero-inner{max-width:1080px;margin:0 auto;padding:56px 24px 40px;position:relative;z-index:2;}
.hero-ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:min(22vw,230px);font-weight:800;color:rgba(255,255,255,.045);white-space:nowrap;
  letter-spacing:.02em;pointer-events:none;z-index:1;user-select:none;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:#d8d0c2;
  border:1px solid rgba(255,255,255,.22);padding:5px 14px;border-radius:20px;margin-bottom:22px;}
.hero h1{font-size:clamp(40px,7vw,72px);font-weight:800;margin:0 0 14px;letter-spacing:-.01em;line-height:1.05;}
.hero h1 .accent{color:var(--accent);}
.hero p.lead{font-size:16px;color:#cfc7b8;max-width:520px;margin:0 0 28px;}
.hero-stats{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:32px;}
.hero-stat b{display:block;font-size:20px;font-weight:800;}
.hero-stat span{font-size:12px;color:#a89e8c;}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:40px;font-weight:700;font-size:14px;
  text-decoration:none;cursor:pointer;border:1px solid transparent;transition:transform .15s ease;}
.btn:hover{transform:translateY(-1px);}
.btn-light{background:#f5f2ec;color:#111;}
.btn-outline{border-color:rgba(255,255,255,.35);color:#f5f2ec;}
.hero-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:11.5px;color:#a89e8c;
  border-top:1px solid rgba(255,255,255,.14);margin-top:36px;padding-top:16px;position:relative;z-index:2;}

/* ---------- About ---------- */
.about{padding:72px 0;}
.about-grid{display:grid;grid-template-columns:220px 1fr;gap:48px;align-items:start;}
.moon{width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle at 32% 30%, #fff6e6 0%, #f0d9a8 30%, var(--accent) 72%, #7a3416 100%);
  box-shadow:0 0 0 1px var(--line), inset -18px -18px 40px rgba(0,0,0,.28);}
.eyebrow-2{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px;}
.about h2{font-size:26px;font-weight:800;line-height:1.5;margin:0 0 18px;max-width:620px;}
.about h2 .muted-ink{color:var(--muted);font-weight:600;}
.about p{color:var(--muted);max-width:560px;margin:0 0 22px;font-size:14px;}
.pill-row{display:flex;gap:10px;flex-wrap:wrap;}
.pill{padding:14px 26px;border-radius:40px;font-weight:800;font-size:14px;background:var(--paper-2);border:1px solid var(--line);}
.pill.dark{background:var(--ink);color:#f5f2ec;}
.pill.accent{background:var(--accent);color:#fff;}
.pill.arrow{width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--ink);color:#fff;border-radius:50%;}

/* ---------- 子系统网格 ---------- */
.subsys{padding:20px 0 76px;}
.subsys-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:28px;}
.subsys-head h2{font-size:28px;font-weight:800;margin:8px 0 0;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
.card{background:var(--ink);color:#f5f2ec;border-radius:20px;padding:22px;min-height:190px;
  display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;}
.card .icon{font-size:26px;}
.card h3{font-size:16px;font-weight:800;margin:14px 0 6px;}
.card p{font-size:12.5px;color:#c9c2b3;margin:0 0 14px;min-height:34px;}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;}
.card .tags span{font-size:10.5px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.1);color:#e9e4d8;}

/* ---------- 功能区（更新日志 / 指令手册） ---------- */
.func{background:var(--paper-2);padding:64px 0 80px;scroll-margin-top:76px;}
.tabs{display:flex;gap:8px;margin-bottom:24px;}
.tab-btn{padding:12px 22px;border:1px solid var(--line);background:var(--paper);color:var(--muted);
  font-size:13.5px;font-weight:700;border-radius:40px;cursor:pointer;}
.tab-btn.active{background:var(--ink);color:#f5f2ec;border-color:var(--ink);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* 更新日志：文件夹标签堆叠——每个版本是一个可以"拉出来看"的标签夹 */
.folder-stack{display:flex;flex-direction:column;padding-top:18px;}
.folder{position:relative;margin-top:26px;}
.folder:first-child{margin-top:0;}
.folder-tab{position:relative;width:100%;border:none;cursor:pointer;font-family:inherit;text-align:left;
  border-radius:16px;padding:20px 22px;color:#fff;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  box-shadow:0 16px 30px rgba(0,0,0,.35);}
.folder-tab-chip{position:absolute;top:-16px;padding:7px 16px 11px;border-radius:10px 10px 0 0;
  font-size:11px;font-weight:800;letter-spacing:.06em;color:#fff;background:inherit;text-transform:uppercase;}
.folder:nth-child(odd) .folder-tab-chip{left:22px;}
.folder:nth-child(even) .folder-tab-chip{right:22px;}
.ver-num{font-size:19px;font-weight:800;}
.ver-date{font-size:12px;opacity:.8;}
.ver-latest{font-size:10.5px;background:rgba(255,255,255,.24);color:#fff;padding:4px 11px;border-radius:20px;font-weight:800;margin-left:auto;}
.folder-chevron{opacity:.85;transition:transform .2s;margin-left:6px;}
.folder.open .folder-chevron{transform:rotate(180deg);}
.folder-content{max-height:0;overflow:hidden;transition:max-height .35s ease;background:var(--paper);border-radius:0 0 16px 16px;}
.folder.open .folder-content{max-height:3000px;}
.ver-body{padding:18px 22px 22px;}
.ver-group{margin-bottom:14px;}
.ver-group:last-child{margin-bottom:0;}
.ver-group-title{display:inline-block;font-size:12px;font-weight:700;padding:3px 12px;border-radius:20px;margin-bottom:9px;}
.tag-feat{background:var(--tag-feat-bg);color:var(--tag-feat-fg);}
.tag-fix{background:var(--tag-fix-bg);color:var(--tag-fix-fg);}
.tag-improve{background:var(--tag-improve-bg);color:var(--tag-improve-fg);}
.tag-chore{background:var(--tag-chore-bg);color:var(--tag-chore-fg);}
.ver-list{margin:0;padding-left:20px;}
.ver-list li{margin:5px 0;font-size:13.5px;}
.ver-note{font-size:12.5px;color:var(--muted);text-align:center;padding:8px 0 0;}

.manual-subnav{display:flex;gap:8px;margin-bottom:20px;}
.msub{padding:9px 18px;border:1px solid var(--line);background:var(--paper);color:var(--muted);
  font-size:13px;font-weight:700;border-radius:40px;cursor:pointer;font-family:inherit;}
.msub.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.msub-panel{display:none;}
.msub-panel.active{display:block;}

.manual-toolbar{margin-bottom:6px;}
#cmdSearch{width:100%;padding:14px 20px;border-radius:40px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font-size:14px;font-family:inherit;}
#cmdSearch:focus{outline:none;border-color:var(--accent);}
.manual-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 4px;font-size:12px;color:var(--muted);}
.role-filter{display:flex;gap:6px;}
.role-filter button{padding:5px 14px;border-radius:20px;border:1px solid var(--line);background:var(--paper);
  color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.role-filter button.active{background:var(--ink);color:#f5f2ec;border-color:var(--ink);}
.cat-pills{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0 22px;}
.cat-pill{font-size:12px;font-weight:700;padding:6px 14px;border-radius:20px;background:var(--paper);
  border:1px solid var(--line);color:var(--muted);cursor:pointer;white-space:nowrap;}
.cat-pill:hover{border-color:var(--accent);color:var(--ink);}

.cmd-section{background:var(--paper);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;scroll-margin-top:88px;}
.cmd-section-head{width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;
  background:none;border:none;cursor:pointer;text-align:left;font-family:inherit;}
.cmd-section-head h2{font-size:15px;font-weight:800;margin:0;display:inline;}
.cmd-section-head .count{font-size:11.5px;color:var(--muted);font-weight:600;margin-left:8px;}
.cmd-section .chevron{transition:transform .15s;color:var(--muted);}
.cmd-section.open .chevron{transform:rotate(180deg);}
.cmd-list{display:none;padding:0 20px 16px;}
.cmd-section.open .cmd-list{display:block;}
.cmd-row{padding:12px 0;border-top:1px solid var(--line);}
.cmd-row:first-child{border-top:none;}
.cmd-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:5px;}
.cmd-name{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13.5px;font-weight:700;background:var(--paper-2);
  padding:3px 9px;border-radius:8px;}
.role-badge{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.role-badge.role-admin{background:var(--tag-fix-bg);color:var(--tag-fix-fg);}
.role-badge.role-player{background:var(--tag-feat-bg);color:var(--tag-feat-fg);}
.cmd-desc{font-size:13.5px;color:var(--muted);}
.usage{margin:8px 0 0;padding:10px 14px;background:var(--paper-2);border-radius:10px;font-size:12.5px;
  color:var(--ink);white-space:pre-wrap;font-family:ui-monospace,"SF Mono",Menlo,monospace;}
.no-result{text-align:center;padding:40px 0;color:var(--muted);font-size:13.5px;display:none;}

/* 使用指南（沿用旧版结构类名，重新配色） */
.guide{background:var(--paper);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;}
.guide-head{width:100%;text-align:left;background:none;border:none;padding:16px 20px;font-size:15px;font-weight:800;
  color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-family:inherit;}
.guide-body{display:none;padding:0 20px 18px;}
.guide-body.open{display:block;}
.g-p{font-size:13.5px;margin:7px 0;color:var(--ink);}
.g-hr{border:none;border-top:1px solid var(--line);margin:12px 0;}
.g-pagebreak{border-top:2px dashed var(--line);margin:20px 0;}
.g-row{display:flex;gap:14px;background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0;}
.g-col{flex:1;min-width:0;}
.g-col:first-child{flex:0 0 auto;max-width:120px;}
.g-box{background:var(--tag-fix-bg);color:var(--tag-fix-fg);border-radius:8px;padding:8px 12px;margin:6px 0;font-weight:700;}
table.g-table{width:100%;border-collapse:collapse;margin:12px 0;font-size:12.5px;}
table.g-table th{background:var(--tag-fix-bg);color:var(--tag-fix-fg);text-align:left;padding:7px 10px;font-size:12px;}
table.g-table td{border-top:1px solid var(--line);padding:8px 10px;vertical-align:top;color:var(--ink);}
table.g-table tr:nth-child(even) td{background:var(--paper-2);}

.foot{padding:28px 0;text-align:center;font-size:12px;color:var(--muted);}

@media (max-width:720px){
  .about-grid{grid-template-columns:1fr;}
  .moon{width:110px;height:110px;}
  .nav-links{display:none;}
}

/* ===== 2026 visual refresh ===== */
:root{--accent:#ef6a2e;--paper-2:#f1f1ef;--radius:30px;}
body{background:#d8d8d6;letter-spacing:-.01em;}
.site-shell{width:min(1240px,calc(100% - 36px));margin:18px auto;background:var(--paper);box-shadow:0 26px 80px rgba(0,0,0,.12);overflow:hidden;}
.wrap,.nav-inner,.hero-inner{max-width:1160px;}
.nav{position:relative;background:var(--paper)!important;border:0;backdrop-filter:none;}
.nav-inner{padding:22px 30px;}
.brand{font-size:15px;letter-spacing:-.03em}.brand .dot{width:18px;height:18px;border-radius:5px;background:var(--ink);position:relative}.brand .dot:after{content:"";position:absolute;inset:5px 2px;border-top:2px solid var(--paper);border-bottom:2px solid var(--paper)}
.nav-links{font-size:12px;gap:30px}.nav-meta{padding:7px 12px;border:1px solid var(--line);border-radius:999px;color:var(--ink);font-weight:700}
.hero{width:calc(100% - 28px);margin:0 auto;border-radius:26px;min-height:680px;background:#080909;isolation:isolate;}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,5,5,.98) 0%,rgba(4,5,5,.6) 27%,rgba(4,5,5,0) 49%,rgba(4,5,5,.25) 65%,rgba(4,5,5,.92) 100%),linear-gradient(0deg,#050606 0%,transparent 32%);z-index:1}
.hero:after{content:"";position:absolute;inset:0;background:url('assets/changri-hero-android-v2.png') center 34%/cover no-repeat;z-index:0;filter:saturate(.8) contrast(1.06)}
.hero-inner{min-height:680px;padding:64px 44px 30px;display:grid;grid-template-columns:minmax(280px,1fr) minmax(270px,.72fr);grid-template-rows:1fr auto;align-items:center;gap:50px;}
.hero-copy{position:relative;z-index:3}.hero h1{font-size:clamp(54px,7.2vw,96px);line-height:1.15;letter-spacing:-.03em;margin:18px 0 24px;max-width:620px}.hero h1 .accent{display:block;font-size:.55em;letter-spacing:-.04em;margin-top:16px;color:#fff;font-weight:500}.eyebrow{margin:0;color:#ddd;border:0;padding:0;text-transform:uppercase;letter-spacing:.12em}.eyebrow:before{content:"";width:26px;height:1px;background:var(--accent)}
.hero p.lead{font-size:14px;line-height:1.75;color:#aaa;max-width:430px}.hero-ghost{font-size:clamp(120px,19vw,260px);align-items:flex-end;justify-content:center;padding-bottom:10px;color:rgba(255,255,255,.055);letter-spacing:-.09em;}
.hero-side{position:relative;z-index:3;align-self:end;margin-bottom:92px;padding:22px;border:1px solid rgba(255,255,255,.16);border-radius:20px;background:rgba(12,13,13,.48);backdrop-filter:blur(10px)}
.side-label{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.14em}.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:16px 0 22px}.hero-stat{border-right:1px solid rgba(255,255,255,.14);padding-right:12px;margin-right:12px}.hero-stat:last-child{border:0}.hero-stat b{font-size:18px}.hero-stat span{font-size:9px}.hero-cta{gap:8px}.btn{padding:11px 16px;font-size:11px}.btn-light{background:var(--accent);color:#fff}.hero-foot{grid-column:1/-1;width:100%;margin:0;padding:16px 0 0;z-index:3}
.about{padding:100px 0 74px}.about-grid{grid-template-columns:.75fr 1.25fr;gap:80px}.about-art{position:relative;min-height:330px;border-radius:28px;background:#f1f1ef;overflow:hidden}.about-art:before{content:"LONG DAY";position:absolute;left:-15px;bottom:-32px;font-size:74px;line-height:.8;font-weight:800;letter-spacing:-.08em;color:#ddd}.moon{width:190px;height:190px;position:absolute;right:34px;top:34px;box-shadow:0 24px 50px rgba(198,90,46,.24)}.about h2{font-size:clamp(32px,4vw,53px);line-height:1.05;letter-spacing:-.055em;max-width:720px;margin-bottom:28px}.about p{font-size:15px;line-height:1.9}.eyebrow-2{color:var(--accent);letter-spacing:.14em}
.subsys{padding:30px 0 100px}.subsys-head h2{font-size:clamp(34px,5vw,58px);letter-spacing:-.06em;line-height:1}.grid{grid-template-columns:repeat(5,1fr);gap:10px}.card{min-height:260px;border-radius:22px;padding:20px;background:#101111;transition:transform .25s,background .25s}.card:nth-child(3n+2){background:#e8e8e5;color:#111}.card:nth-child(3n+2) p{color:#666}.card:nth-child(3n+2) .tags span{background:#fff;color:#333}.card:hover{transform:translateY(-6px)}.card .icon{font-size:22px;filter:grayscale(1)}.card h3{font-size:18px;letter-spacing:-.03em}.card p{line-height:1.65}.card:after{content:"↗";position:absolute;right:18px;top:18px;width:28px;height:28px;border:1px solid currentColor;border-radius:50%;display:grid;place-items:center;font-size:11px;opacity:.45}

/* ---------- 许愿墙 ---------- */
.page-head{padding:52px 0 8px;}
.page-head h1{font-size:clamp(30px,5vw,44px);font-weight:800;margin:16px 0 12px;letter-spacing:-.02em;}
.page-head p{color:var(--muted);max-width:560px;font-size:14.5px;}

.wish-form{background:var(--paper-2);border:1px solid var(--line);border-radius:20px;padding:26px;margin:26px 0 8px;}
.wish-form textarea{width:100%;min-height:88px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font-family:inherit;font-size:14px;resize:vertical;}
.wish-form input[type=text]{width:100%;max-width:260px;padding:12px 16px;border-radius:14px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font-family:inherit;font-size:14px;margin-top:10px;}
.wish-form textarea:focus,.wish-form input:focus{outline:none;border-color:var(--accent);}
.wish-form-foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-top:14px;}
.wish-counter{font-size:12px;color:var(--muted);}
.wish-msg{font-size:13px;margin-top:10px;min-height:16px;}
.wish-msg.err{color:#c0392b;}
.wish-msg.ok{color:#1d7a44;}

.wish-section-title{font-size:19px;font-weight:800;margin:40px 0 16px;display:flex;align-items:center;gap:10px;}
.wish-section-title .count-badge{font-size:12px;background:var(--paper-2);color:var(--muted);padding:3px 10px;border-radius:20px;font-weight:700;}

.wish-list{display:flex;flex-direction:column;gap:12px;}
.wish-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;}
.wish-card.implemented{border-color:#bfe3cc;}
.wish-card .wish-content{font-size:14.5px;line-height:1.6;margin-bottom:10px;white-space:pre-wrap;}
.wish-card .wish-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted);}
.wish-badge{font-size:11px;font-weight:800;padding:4px 11px;border-radius:20px;white-space:nowrap;}
.wish-badge.pending{background:var(--tag-fix-bg);color:var(--tag-fix-fg);}
.wish-badge.implemented{background:var(--tag-feat-bg);color:var(--tag-feat-fg);}
.wish-note{margin-top:10px;padding:10px 14px;background:var(--tag-feat-bg);color:var(--tag-feat-fg);border-radius:10px;font-size:13px;}
.wish-actions{display:flex;gap:8px;margin-top:10px;}
.wish-actions button{font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:20px;border:1px solid var(--line);
  background:var(--paper);color:var(--muted);cursor:pointer;font-family:inherit;}
.wish-actions button:hover{border-color:var(--accent);color:var(--ink);}
.wish-actions button.danger:hover{border-color:#c0392b;color:#c0392b;}
.wish-inline-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;}
.wish-inline-form input[type=text]{flex:1;min-width:140px;padding:8px 12px;border-radius:20px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font-family:inherit;font-size:12.5px;}
.wish-inline-form input:focus{outline:none;border-color:var(--accent);}
.wish-inline-form button{font-size:11.5px;font-weight:700;padding:6px 14px;border-radius:20px;border:1px solid var(--line);
  background:var(--paper);color:var(--muted);cursor:pointer;font-family:inherit;white-space:nowrap;}
.wish-inline-form button:hover{border-color:var(--accent);color:var(--ink);}
.wish-inline-form button.danger{border-color:#c0392b;color:#c0392b;}
.wish-confirm-text{font-size:12px;color:#c0392b;font-weight:700;}
.wish-empty{text-align:center;padding:36px 0;color:var(--muted);font-size:13.5px;}

.admin-bar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin:24px 0 -6px;}
.admin-toggle{font-size:12px;color:var(--muted);background:none;border:none;cursor:pointer;font-family:inherit;text-decoration:underline;}
.admin-status{font-size:12px;color:#1d7a44;font-weight:700;display:none;align-items:center;gap:8px;}
.admin-status button{font-size:11px;background:none;border:none;color:var(--muted);cursor:pointer;text-decoration:underline;font-family:inherit;}
.admin-login-box{display:none;background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:14px 0;gap:10px;align-items:center;flex-wrap:wrap;}
.admin-login-box.show{display:flex;}
.admin-login-box input{padding:9px 14px;border-radius:10px;border:1px solid var(--line);font-family:inherit;font-size:13px;background:var(--paper);color:var(--ink);}
.wish-foot-space{height:60px;}
</style>
</head>

<body><div class="site-shell">

<nav class="nav">
  <div class="nav-inner">
    <div class="brand"><span class="dot"></span>长日将尽</div>
    <div class="nav-links">
      <a href="changri_hub.html">系统主页</a>
      <a href="changri_hub.html#func">更新日志/指令手册</a>
      <a href="player_guide.html" target="_blank">玩家指南</a>
      <a class="active">许愿墙</a>
    </div>
    <div class="nav-meta">SYSTEM · v1.8.1</div>
  </div>
</nav>

<div class="wrap">
  <div class="page-head">
    <span class="eyebrow" style="color:var(--muted);border-color:var(--line);">🌟 COMMUNITY BOARD</span>
    <h1>许愿墙</h1>
    <p>想要什么新功能、发现什么用着不顺手的地方，写在这里。作者会不定期翻牌，做完的会在下面标"已实施"。</p>
  </div>

  <form class="wish-form" id="wishForm">
    <textarea id="wishContent" maxlength="300" placeholder="比如：希望季度结束时能自动生成一份数据总结……"></textarea>
    <input type="text" id="wishAuthor" maxlength="30" placeholder="署名（选填，不填就是匿名）">
    <div class="wish-form-foot">
      <span class="wish-counter" id="wishCounter">0/300</span>
      <button type="submit" class="btn" style="background:var(--accent);color:#fff;">✨ 许愿</button>
    </div>
    <div class="wish-msg" id="wishMsg"></div>
  </form>

  <div class="admin-bar">
    <span class="admin-status" id="adminStatus">🔓 管理员模式 <button onclick="adminLogout()">退出</button></span>
    <button class="admin-toggle" onclick="toggleAdminBox()">作者入口</button>
  </div>
  <div class="admin-login-box" id="adminLoginBox">
    <input type="password" id="adminPwInput" placeholder="管理密码">
    <button class="btn btn-outline" style="border-color:var(--line);color:var(--ink);padding:9px 18px;" onclick="tryAdminLogin()">进入</button>
  </div>

  <div class="wish-section-title">⏳ 待实现 <span class="count-badge" id="pendingCount">0</span></div>
  <div class="wish-list" id="pendingList"></div>

  <div class="wish-section-title">✅ 已实施 <span class="count-badge" id="implementedCount">0</span></div>
  <div class="wish-list" id="implementedList"></div>

  <div class="wish-foot-space"></div>
</div>

<div class="foot">长日将尽系统 · 长期运营中<br><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener" style="color:inherit">浙ICP备2026078867号-1</a></div>

</div>

<script>
const API_BASE = "/api/changri_wishes";
let adminPassword = sessionStorage.getItem("changriWishAdminPw") || "";

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function fmtDate(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// 每条许愿的临时 UI 状态：'note'=正在填写实施备注，'delete'=正在确认删除，null=平时的按钮态。
// 不用原生 prompt/confirm/alert——嵌在 QQ 内置浏览器等环境里原生弹窗容易卡住整个页面，
// 之前联调时就实测遇到点了"标记已实施"后 prompt 弹窗把后续 fetch 卡死、请求根本没发出去。
let activeAction = {};
let actionErrors = {};
let cachedWishes = [];

function renderList(elId, list, isImplemented) {
  const root = document.getElementById(elId);
  if (!list.length) {
    root.innerHTML = `<div class="wish-empty">${isImplemented ? "还没有已实施的许愿" : "还没有人许愿，来当第一个吧"}</div>`;
    return;
  }
  root.innerHTML = list.map(w => {
    const mode = activeAction[w.id] || null;
    let actionsHtml = "";
    if (adminPassword) {
      if (mode === "note") {
        actionsHtml = `
          <div class="wish-inline-form">
            <input type="text" id="note-input-${w.id}" maxlength="200" placeholder="给这条许愿留句话（选填）">
            <button onclick="confirmImplement(${w.id})">确认标记</button>
            <button onclick="cancelAction(${w.id})">取消</button>
          </div>`;
      } else if (mode === "delete") {
        actionsHtml = `
          <div class="wish-inline-form">
            <span class="wish-confirm-text">确定删除？不可恢复</span>
            <button class="danger" onclick="confirmDelete(${w.id})">确认删除</button>
            <button onclick="cancelAction(${w.id})">取消</button>
          </div>`;
      } else {
        actionsHtml = `
          <div class="wish-actions">
            ${isImplemented
              ? `<button onclick="unimplementWish(${w.id})">撤销标记</button>`
              : `<button onclick="startImplement(${w.id})">标记已实施</button>`}
            <button class="danger" onclick="startDelete(${w.id})">删除</button>
          </div>`;
      }
    }
    const errHtml = actionErrors[w.id] ? `<div class="wish-msg err">❌ ${escapeHtml(actionErrors[w.id])}</div>` : "";
    return `
    <div class="wish-card ${isImplemented ? "implemented" : ""}">
      <div class="wish-content">${escapeHtml(w.content)}</div>
      <div class="wish-meta">
        <span>${w.author_name ? escapeHtml(w.author_name) : "匿名"} · ${fmtDate(w.created_at)}</span>
        <span class="wish-badge ${isImplemented ? "implemented" : "pending"}">${isImplemented ? "✅ 已实施" : "⏳ 待实现"}</span>
      </div>
      ${w.admin_note ? `<div class="wish-note">💬 ${escapeHtml(w.admin_note)}</div>` : ""}
      ${errHtml}
      ${actionsHtml}
    </div>`;
  }).join("");
}

function renderAll() {
  const pending = cachedWishes.filter(w => w.status === "pending");
  const implemented = cachedWishes.filter(w => w.status === "implemented");
  renderList("pendingList", pending, false);
  renderList("implementedList", implemented, true);
  document.getElementById("pendingCount").textContent = pending.length;
  document.getElementById("implementedCount").textContent = implemented.length;
}

async function loadWishes() {
  const res = await fetch(API_BASE);
  const data = await res.json();
  cachedWishes = data.wishes || [];
  renderAll();
}

function startImplement(id) { actionErrors[id] = null; activeAction[id] = "note"; renderAll(); }
function startDelete(id)    { actionErrors[id] = null; activeAction[id] = "delete"; renderAll(); }
function cancelAction(id)   { actionErrors[id] = null; activeAction[id] = null; renderAll(); }

document.getElementById("wishForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const content = document.getElementById("wishContent").value.trim();
  const author = document.getElementById("wishAuthor").value.trim();
  const msgEl = document.getElementById("wishMsg");
  msgEl.textContent = "";
  msgEl.className = "wish-msg";
  if (!content) { msgEl.textContent = "写点什么吧～"; msgEl.classList.add("err"); return; }
  const res = await fetch(API_BASE, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ content, author_name: author })
  });
  const data = await res.json();
  if (data.ok) {
    msgEl.textContent = "✅ 许愿已提交，感谢！";
    msgEl.classList.add("ok");
    document.getElementById("wishContent").value = "";
    document.getElementById("wishAuthor").value = "";
    document.getElementById("wishCounter").textContent = "0/300";
    loadWishes();
  } else {
    msgEl.textContent = "❌ " + (data.error || "提交失败");
    msgEl.classList.add("err");
  }
});

document.getElementById("wishContent").addEventListener("input", (e) => {
  document.getElementById("wishCounter").textContent = `${e.target.value.length}/300`;
});

function toggleAdminBox() {
  document.getElementById("adminLoginBox").classList.toggle("show");
}

function tryAdminLogin() {
  const pw = document.getElementById("adminPwInput").value;
  if (!pw) return;
  adminPassword = pw;
  sessionStorage.setItem("changriWishAdminPw", pw);
  document.getElementById("adminLoginBox").classList.remove("show");
  document.getElementById("adminPwInput").value = "";
  document.getElementById("adminStatus").style.display = "inline-flex";
  loadWishes();
}

function adminLogout() {
  adminPassword = "";
  sessionStorage.removeItem("changriWishAdminPw");
  document.getElementById("adminStatus").style.display = "none";
  loadWishes();
}

async function confirmImplement(id) {
  const inputEl = document.getElementById(`note-input-${id}`);
  const note = inputEl ? inputEl.value.trim() : "";
  const res = await fetch(`${API_BASE}/${id}/implement`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: adminPassword, admin_note: note })
  });
  const data = await res.json();
  if (!data.ok) { actionErrors[id] = data.error || "操作失败"; renderAll(); return; }
  activeAction[id] = null;
  loadWishes();
}

async function unimplementWish(id) {
  const res = await fetch(`${API_BASE}/${id}/unimplement`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: adminPassword })
  });
  const data = await res.json();
  if (!data.ok) { actionErrors[id] = data.error || "操作失败"; renderAll(); return; }
  loadWishes();
}

async function confirmDelete(id) {
  const res = await fetch(`${API_BASE}/${id}`, {
    method: "DELETE", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: adminPassword })
  });
  const data = await res.json();
  if (!data.ok) { actionErrors[id] = data.error || "操作失败"; renderAll(); return; }
  activeAction[id] = null;
  loadWishes();
}

if (adminPassword) document.getElementById("adminStatus").style.display = "inline-flex";
loadWishes();
</script>

</body>
</html>
