{% extends "base.html" %}
{% block title %}注册 - 九霄仙门{% endblock %}
{% block content %}
<div class="game-entry">
<section class="entry-lore">
  <div class="entry-kicker">仙途初启 · 拜入山门</div>
  <h1 class="entry-title">问道九霄</h1>
  <p class="entry-desc">刻下名讳，静候仙门审核。你的每一次修炼与晋升，都将被写入宗门纪年。</p>
  <div class="entry-runes"><span>创建身份</span><span>加入宗门</span><span>开启仙途</span></div>
</section>
<div class="card entry-panel" style="max-width:390px;width:100%;margin:0 auto">
  <div class="panel-mark">◇</div>
  <div class="panel-caption">仙籍录入</div>
  <h3 style="margin-bottom:16px;text-align:center">拜入山门</h3>
  <form method="post">
    <label>用户名</label>
    <input name="username" value="{{ form.username or '' }}" required>
    <label>密码(至少6位)</label>
    <input type="password" name="password" required>
    <label>QQ号</label>
    <input name="qq" value="{{ form.qq or '' }}" inputmode="numeric" pattern="[0-9]{5,11}" required>
    <label>邀请码(选填,填写有效邀请码可免审核直接登录)</label>
    <input name="invite_code" value="{{ form.invite_code or '' }}">
    <button class="btn btn-primary" style="margin-top:18px;width:100%;padding:12px">递交拜帖</button>
  </form>
  <p class="muted" style="margin-top:12px">已有账号? <a href="{{ url_for('login') }}">去登录</a></p>
</div>
</div>
{% endblock %}
