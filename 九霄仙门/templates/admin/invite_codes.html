{% extends "base.html" %}
{% block title %}邀请码 - 九霄仙门{% endblock %}
{% block content %}
<div class="card">
  <h3 style="margin-bottom:10px">生成邀请码</h3>
  <form method="post">
    <label>邀请码</label>
    <input name="code" required>
    <label>最大使用次数</label>
    <input type="number" name="max_uses" value="1" min="1">
    <label>有效天数(0=永久)</label>
    <input type="number" name="expire_days" value="0" min="0">
    <button class="btn btn-primary" style="margin-top:12px">生成</button>
  </form>
</div>
<div class="card">
  <table>
    <tr><th>邀请码</th><th>已用/上限</th><th>过期时间</th><th>创建时间</th></tr>
    {% for c in codes %}
    <tr>
      <td>{{ c.code }}</td>
      <td>{{ c.used_count }}/{{ c.max_uses }}</td>
      <td>{{ c.expires_ts | fmt_ts if c.expires_ts else '永久' }}</td>
      <td>{{ c.created_ts | fmt_ts }}</td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
