{% extends "base.html" %}
{% block body %}
<h1>🧳 流动商人</h1>
<p><a href="{{ url_for('dashboard') }}">← 返回</a></p>
<p class="muted">钱包货币在这里花,库存每隔几小时刷新一次,不卖地标级材料(不削弱终局节奏)。</p>

{% for row in stock %}
<div class="card row">
  <span>{{ item_names.get(row.resource_key,row.resource_key) }} 剩{{ row.stock_amount }}份 · 单价{{ row.price }}</span>
  <form method="post" action="{{ url_for('action_merchant_buy') }}">
    <input type="hidden" name="resource_key" value="{{ row.resource_key }}">
    <input name="amount" type="number" min="1" value="1" style="width:60px">
    <button>买</button>
  </form>
</div>
{% else %}
<p class="muted">商人现在没货,等下次刷新吧</p>
{% endfor %}
{% endblock %}
