{% extends "base.html" %}
{% block body %}
<h1>登录</h1>
<form method="post">
  <p><input name="username" placeholder="用户名" required style="width:100%"></p>
  <p><input name="password" type="password" placeholder="密码" required style="width:100%"></p>
  <button type="submit">登录</button>
</form>
<p class="muted">没有账号? <a href="{{ url_for('register') }}">注册一个</a></p>
{% endblock %}
