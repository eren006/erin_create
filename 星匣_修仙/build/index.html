<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>云京弃子</title>
<style>
/* 《云京弃子》—— 水墨暗金 · 移动端优先 */
*, *::before, *::after { box-sizing: border-box; }

:root {
  --ink:      #0b0d10;   /* 最深底 */
  --paper:    #13161b;   /* 正文纸面 */
  --paper-2:  #1a1e25;   /* 抬起的面 */
  --line:     #2a3038;   /* 分隔线 */
  --text:     #d9d3c6;   /* 正文米白 */
  --text-dim: #8a9098;   /* 次要文字 */
  --gold:     #c9a227;   /* 暗金强调 */
  --gold-dim: #7d6518;
  --blood:    #9c3b34;   /* 危险/代价 */
  --jade:     #4f8a6d;   /* 增益 */
  --serif: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
}

html, body {
  margin: 0; padding: 0;
  height: 100%;
  background: var(--ink);
  color: var(--text);
  font-family: var(--serif);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}

body {
  display: flex;
  justify-content: center;
}

/* 舞台：手机竖屏为基准，桌面居中留白 */
#stage {
  width: 100%;
  max-width: 620px;
  height: 100%;
  max-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--paper);
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 60px rgba(0,0,0,.6);
}

/* ── 状态栏 ─────────────────────────────── */
#hud {
  flex: 0 0 auto;
  padding: 10px 16px 8px;
  background: linear-gradient(180deg, var(--paper-2), var(--paper));
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  letter-spacing: .04em;
  display: none;               /* 捏人完成前隐藏 */
}
#hud.on { display: block; }

#hud .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: baseline; }
#hud .chapter { color: var(--gold); font-size: 12px; letter-spacing: .18em; }
#hud .stat { color: var(--text-dim); white-space: nowrap; }
#hud .stat b { color: var(--text); font-weight: normal; }
#hud .stat.warn b { color: var(--blood); }

/* 修为进度条 */
#expbar {
  margin-top: 7px; height: 2px;
  background: var(--line); border-radius: 2px; overflow: hidden;
}
#expbar i {
  display: block; height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold));
  transition: width .6s ease;
}

/* ── 正文 ───────────────────────────────── */
#scroll {
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 26px 22px 8px;
}
#scroll::-webkit-scrollbar { width: 3px; }
#scroll::-webkit-scrollbar-thumb { background: var(--line); }

.scene-title {
  text-align: center;
  color: var(--gold);
  font-size: 13px;
  letter-spacing: .35em;
  text-indent: .35em;
  margin: 8px 0 26px;
  opacity: 0;
  animation: rise .8s ease forwards;
}
.scene-title::after {
  content: ""; display: block;
  width: 40px; height: 1px;
  background: var(--gold-dim);
  margin: 12px auto 0;
}

p.para {
  font-size: 16.5px;
  line-height: 2.05;
  margin: 0 0 1.15em;
  text-indent: 2em;
  opacity: 0;
  animation: rise .7s ease forwards;
}
/* 对白：不缩进，稍亮 */
p.para.talk { text-indent: 0; color: #e6e0d2; }
/* 旁白/心声：小一号，偏灰 */
p.para.aside { font-size: 15px; color: var(--text-dim); font-style: normal; }

@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* 判定条 */
.roll {
  margin: 20px 0; padding: 12px 14px;
  border: 1px solid var(--line);
  background: var(--paper-2);
  font-size: 13px; line-height: 1.8;
  color: var(--text-dim);
  opacity: 0; animation: rise .6s ease forwards;
}
.roll .label { color: var(--gold); letter-spacing: .1em; }
.roll .win  { color: var(--jade); }
.roll .lose { color: var(--blood); }

/* 数值变动提示 */
.delta {
  margin: 16px 0; text-align: center;
  font-size: 13px; letter-spacing: .1em;
  opacity: 0; animation: rise .6s ease forwards;
}
.delta .up   { color: var(--jade); }
.delta .down { color: var(--blood); }
.delta .item { color: var(--gold); }

/* ── 选项区 ─────────────────────────────── */
#choices {
  flex: 0 0 auto;
  padding: 6px 18px calc(18px + env(safe-area-inset-bottom));
  background: linear-gradient(180deg, transparent, var(--paper) 22%);
}

button.choice {
  display: block; width: 100%;
  margin: 9px 0; padding: 14px 16px;
  background: var(--paper-2);
  border: 1px solid var(--line);
  border-left: 2px solid var(--gold-dim);
  color: var(--text);
  font-family: var(--serif);
  font-size: 15.5px; line-height: 1.6;
  text-align: left;
  cursor: pointer;
  opacity: 0;
  animation: rise .5s ease forwards;
  transition: background .2s, border-color .2s, transform .12s;
}
button.choice:active { transform: scale(.985); }
@media (hover: hover) {
  button.choice:hover { background: #212630; border-left-color: var(--gold); }
}
button.choice .hint {
  display: block; margin-top: 5px;
  font-size: 12.5px; color: var(--text-dim); letter-spacing: .02em;
}
button.choice .hint .cost { color: var(--blood); }
button.choice .hint .gain { color: var(--jade); }

/* 不满足条件的灰选项 */
button.choice.locked {
  color: #545a63; border-left-color: #333;
  cursor: not-allowed;
}
button.choice.locked .hint { color: #4a5058; }

/* "继续"按钮 */
button.next {
  display: block; margin: 12px auto 4px;
  padding: 10px 34px;
  background: none; border: 1px solid var(--line);
  color: var(--text-dim);
  font-family: var(--serif); font-size: 14px; letter-spacing: .3em; text-indent: .3em;
  cursor: pointer;
  opacity: 0; animation: rise .5s ease forwards;
  transition: color .2s, border-color .2s;
}
button.next:active { transform: scale(.98); }
@media (hover: hover) {
  button.next:hover { color: var(--gold); border-color: var(--gold-dim); }
}

/* ── 顶栏按钮（存档/档案）──────────────── */
#tools {
  position: absolute; top: 8px; right: 10px;
  display: flex; gap: 2px; z-index: 30;
}
#tools button {
  background: none; border: none;
  color: var(--text-dim); font-family: var(--serif);
  font-size: 12px; letter-spacing: .1em;
  padding: 6px 8px; cursor: pointer;
}
#tools button:active { color: var(--gold); }

/* ── 弹层 ───────────────────────────────── */
#modal {
  position: absolute; inset: 0; z-index: 50;
  background: rgba(5,6,8,.88);
  display: none;
  padding: 40px 22px;
  overflow-y: auto;
}
#modal.on { display: block; animation: rise .3s ease forwards; }
#modal h3 {
  color: var(--gold); font-size: 14px; font-weight: normal;
  letter-spacing: .3em; text-align: center; margin: 0 0 22px;
}
#modal .kv { display: flex; justify-content: space-between;
  padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
#modal .kv span { color: var(--text-dim); }
#modal .sect { margin: 26px 0 10px; color: var(--gold-dim);
  font-size: 12px; letter-spacing: .2em; }
#modal .note { font-size: 13.5px; line-height: 1.9; color: var(--text-dim); }
#modal .close {
  display: block; margin: 30px auto 0; padding: 10px 30px;
  background: none; border: 1px solid var(--line); color: var(--text-dim);
  font-family: var(--serif); letter-spacing: .3em; text-indent: .3em; cursor: pointer;
}

/* ── 标题画面 ───────────────────────────── */
#title {
  position: absolute; inset: 0; z-index: 60;
  background: var(--ink);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 24px;
}
#title.gone { display: none; }
#title .main {
  font-size: 40px; letter-spacing: .5em; text-indent: .5em;
  color: var(--text);
  margin-bottom: 18px;
  animation: rise 1.4s ease forwards;
}
#title .sub {
  font-size: 12.5px; letter-spacing: .35em; text-indent: .35em;
  color: var(--text-dim); margin-bottom: 56px;
  opacity: 0; animation: rise 1.2s .5s ease forwards;
}
#title button {
  display: block; width: 210px; margin: 10px 0; padding: 13px;
  background: none; border: 1px solid var(--line);
  color: var(--text); font-family: var(--serif);
  font-size: 15px; letter-spacing: .28em; text-indent: .28em;
  cursor: pointer; opacity: 0;
  animation: rise .9s ease forwards;
  transition: border-color .25s, color .25s;
}
#title button:nth-of-type(1) { animation-delay: 1.0s; }
#title button:nth-of-type(2) { animation-delay: 1.15s; }
#title button:disabled { color: #4a5058; cursor: not-allowed; }
@media (hover: hover) {
  #title button:not(:disabled):hover { color: var(--gold); border-color: var(--gold-dim); }
}
#title .foot {
  position: absolute; bottom: 22px;
  font-size: 11px; color: #3f454d; letter-spacing: .16em;
  opacity: 0; animation: rise 1s 1.6s ease forwards;
}

/* 小屏微调 */
@media (max-height: 680px) {
  #scroll { padding-top: 18px; }
  p.para { font-size: 16px; line-height: 1.95; }
  #title .main { font-size: 34px; }
  #title .sub { margin-bottom: 40px; }
}

</style>

<div id="stage">
  <div id="hud"></div>
  <div id="scroll"></div>
  <div id="choices"></div>

  <div id="tools"><button id="btn-profile">生 平</button></div>
  <div id="modal"></div>

  <div id="title">
    <div class="main">云京弃子</div>
    <div class="sub">测灵之日，有人在石上动了手脚</div>
    <button id="btn-new">新 的 一 世</button>
    <button id="btn-continue">续 前 缘</button>
    <div class="foot">存档保存在本机浏览器</div>
  </div>
</div>

<script>
/* ===== src/engine.js ===== */
/* 《云京弃子》引擎 —— 场景机 / 数值 / 判定 / 存档 */

// ── 境界阶梯 ───────────────────────────────────────────
// exp 为「升入下一境所需」。凡人段不修炼，故为 Infinity（须由剧情推进）。
const REALMS = [
  { n: '凡人',     need: Infinity, life: 80  },
  { n: '炼气一层', need: 100,  life: 120 },
  { n: '炼气二层', need: 160,  life: 120 },
  { n: '炼气三层', need: 240,  life: 120 },
  { n: '炼气四层', need: 360,  life: 120 },
  { n: '炼气五层', need: 520,  life: 120 },
  { n: '炼气六层', need: 740,  life: 120 },
  { n: '炼气七层', need: 1040, life: 120 },
  { n: '炼气八层', need: 1450, life: 120 },
  { n: '炼气九层', need: 2000, life: 120 },
  { n: '筑基初期', need: 3200, life: 200 },
  { n: '筑基中期', need: 4800, life: 200 },
  { n: '筑基后期', need: 7000, life: 200 },
  { n: '金丹初期', need: 12000, life: 500 },
  { n: '金丹中期', need: 18000, life: 500 },
  { n: '金丹后期', need: 26000, life: 500 },
  { n: '元婴初期', need: 45000, life: 1000 },
  { n: '元婴中期', need: 66000, life: 1000 },
  { n: '元婴后期', need: 95000, life: 1000 },
  { n: '化神',     need: 180000, life: 2000 },
  { n: '合体',     need: 400000, life: 5000 },
  { n: '大乘',     need: Infinity, life: 10000 },
];

const GRADES = ['丁下','丁上','丙下','丙上','乙下','乙上','甲下','甲上'];

// ── 状态 ───────────────────────────────────────────────
const S0 = () => ({
  name: '', gender: '', nature: '',
  realm: 0, exp: 0,
  age: 16, months: 0,          // months = 当年内累计月数
  mind: 60,
  wits: 5, body: 2,            // GRADES 下标
  stones: 0,
  items: {}, npc: {}, flags: {},
  chapter: '楔子', scene: 'p_start',
  turns: 0, log: [],
});

let state = S0();
const SCENES = {};

/** 注册场景 */
function S(id, def) { SCENES[id] = def; def.id = id; }

// ── 取值助手 ───────────────────────────────────────────
const realmName = () => REALMS[state.realm].n;
const lifespan   = () => REALMS[state.realm].life;
const expNeed    = () => REALMS[state.realm].need;
const witsName   = () => GRADES[state.wits];
const bodyName   = () => GRADES[state.body];
const has        = (k, n = 1) => (state.items[k] || 0) >= n;
const fav        = (k) => state.npc[k] || 0;
const flag       = (k) => !!state.flags[k];

/** 文本插值：{name} {realm} {ta}（他/她） */
function fill(t) {
  if (typeof t === 'function') t = t(state);
  return String(t)
    .replace(/\{name\}/g, state.name || '你')
    .replace(/\{realm\}/g, realmName())
    .replace(/\{ta\}/g, state.gender === '女' ? '她' : '他')
    .replace(/\{xiong\}/g, state.gender === '女' ? '姑娘' : '小子');
}

// ── 效果结算 ───────────────────────────────────────────
// eff: { exp, mind, stones, age(月), wits, body, items:{}, npc:{}, flags:{}, realm:+1 }
// 返回可展示的变动列表 [{txt, cls}]
function applyEff(eff) {
  if (!eff) return [];
  if (typeof eff === 'function') eff = eff(state) || {};
  const out = [];
  const push = (txt, cls) => out.push({ txt, cls });

  if (eff.months) {
    state.months += eff.months;
    while (state.months >= 12) { state.months -= 12; state.age++; }
  }
  if (eff.exp) {
    state.exp += eff.exp;
    push(`修为 ${eff.exp > 0 ? '+' : ''}${eff.exp}`, eff.exp > 0 ? 'up' : 'down');
    // 自动进阶：仅炼气段内自动，大境界须走剧情/闭关
    while (state.exp >= expNeed() && REALMS[state.realm + 1] && !REALMS[state.realm + 1].n.startsWith('筑基')) {
      state.exp -= expNeed();
      state.realm++;
      push(`境界提升 —— ${realmName()}`, 'item');
    }
  }
  if (eff.mind) {
    state.mind = Math.max(0, Math.min(100, state.mind + eff.mind));
    push(`心境 ${eff.mind > 0 ? '+' : ''}${eff.mind}`, eff.mind > 0 ? 'up' : 'down');
  }
  if (eff.stones) {
    state.stones = Math.max(0, state.stones + eff.stones);
    push(`灵石 ${eff.stones > 0 ? '+' : ''}${eff.stones}`, eff.stones > 0 ? 'up' : 'down');
  }
  if (eff.wits) { state.wits = Math.min(GRADES.length - 1, state.wits + eff.wits); push(`悟性 → ${witsName()}`, 'up'); }
  if (eff.body) { state.body = Math.min(GRADES.length - 1, state.body + eff.body); push(`体魄 → ${bodyName()}`, 'up'); }
  if (eff.realm) { state.realm += eff.realm; state.exp = 0; push(`境界提升 —— ${realmName()}`, 'item'); }

  for (const k in eff.items || {}) {
    const n = eff.items[k];
    state.items[k] = (state.items[k] || 0) + n;
    if (state.items[k] <= 0) { delete state.items[k]; push(`失去 ${k}`, 'down'); }
    else push(n > 0 ? `获得 ${k}` : `失去 ${k}`, n > 0 ? 'item' : 'down');
  }
  for (const k in eff.npc || {}) {
    const n = eff.npc[k];
    if (!n) continue;
    state.npc[k] = (state.npc[k] || 0) + n;
    push(`${k} ${n > 0 ? '好感+' : '好感'}${n}`, n > 0 ? 'up' : 'down');
  }
  for (const k in eff.flags || {}) state.flags[k] = eff.flags[k];
  if (eff.chapter) state.chapter = eff.chapter;

  return out;
}

// ── 判定 ───────────────────────────────────────────────
// roll: { label, dc, base:(s)=>num, bonus:[[名,值]|(s)=>[名,值]|null] }
// 明骰：过程全部展示给玩家
function doRoll(r) {
  const base = typeof r.base === 'function' ? r.base(state) : (r.base || 0);
  const parts = [];
  let total = base;
  (r.bonus || []).forEach(b => {
    const item = typeof b === 'function' ? b(state) : b;
    if (!item) return;
    const [label, val] = item;
    if (!val) return;
    total += val;
    parts.push([label, val]);
  });
  const luck = 1 + Math.floor(Math.random() * 20);   // 天意 1–20
  total += luck;
  parts.push(['天意', luck]);
  return { dc: r.dc, base, parts, total, win: total >= r.dc, label: r.label };
}

// ── 存档 ───────────────────────────────────────────────
const SAVE_KEY = 'yunjing_qizi_save_v1';

function saveGame(slot = 'auto') {
  try {
    const all = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    all[slot] = { s: state, t: Date.now() };
    localStorage.setItem(SAVE_KEY, JSON.stringify(all));
    return true;
  } catch (e) { return false; }
}

function loadGame(slot = 'auto') {
  try {
    const all = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    if (!all[slot]) return false;
    state = Object.assign(S0(), all[slot].s);
    return true;
  } catch (e) { return false; }
}

function hasSave(slot = 'auto') {
  try {
    const all = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    return !!all[slot];
  } catch (e) { return false; }
}


/* ===== src/story/prologue.js ===== */
/* 楔子 · 云京苏氏 */

S('p_start', {
  title: '楔子 · 云 京',
  text: [
    '云京的三月，槐花落了满地。',
    '苏氏祠堂前的青石广场上跪着四十七个少年，从卯时跪到辰时，膝盖底下的石头把凉气一寸寸顶进骨头里。今日是苏氏三年一度的测灵之日——测出灵根者入族学，往后是修士；测不出的，发二十两银子，逐出云京，此生与仙途无涉。',
    '你跪在最末一排。前面的少年们锦袍玉带，腰间悬着族里发的养气玉。你身上是一件洗得发白的粗布直裰，袖口磨破了，昨夜你自己用线缝了三针。',
    ['aside', '你是苏氏的庶子。生母柳氏是外室，五年前的一个冬夜病故，连块正经的碑都没有。'],
    '主祠的铜门开了。执事捧着一方半人高的青灰色石头走出来——测灵石。石面粗粝，中间凹下去一个掌印。',
    ['talk', '「按名录，一个一个来。」'],
  ],
  next: 'p_name',
});

S('p_name', {
  text: [
    '执事翻开名录，开始点名。',
    '你听见自己的名字被念到——那是父亲随口给的，用了十六年。',
    ['aside', '（你叫什么？）'],
  ],
  input: { key: 'name', ph: '输入你的名字', max: 6 },
  to: 'p_gender',
});

S('p_gender', {
  text: [ ['talk', '「{name}」——上前。'] ],
  choices: [
    { t: '（少年）', eff: () => (state.gender = '男', {}), to: 'p_nature' },
    { t: '（少女）', eff: () => (state.gender = '女', {}), to: 'p_nature' },
  ],
});

S('p_nature', {
  text: [
    '你站起身。跪得太久，左腿有一阵密密麻麻的酸麻往上爬，你咬着牙没让自己晃。',
    '四十七道目光落在你背上。你能感觉到那些目光的重量——不是敌意，是更轻慢的东西：他们只是在等一场意料之中的笑话。',
    ['aside', '这些年，你早已学会了一种活法。'],
  ],
  choices: [
    { t: '沉毅隐忍 —— 把牙咬碎了咽下去，路还长',
      hint: '心境根基更稳，逆境中不易崩',
      eff: () => (state.nature = '沉毅隐忍', { mind: 10 }), to: 'p_test' },
    { t: '桀骜锋锐 —— 谁看不起我，我记着',
      hint: '体魄更强，但心境易动，仇怨结得深',
      eff: () => (state.nature = '桀骜锋锐', { body: 2, mind: -5 }), to: 'p_test' },
    { t: '温和圆融 —— 与人为善，总能寻到活路',
      hint: '悟性更佳，更易得人心',
      eff: () => (state.nature = '温和圆融', { wits: 1 }), to: 'p_test' },
  ],
});

S('p_test', {
  text: [

/* ===== src/ui.js ===== */
/* 《云京弃子》渲染层 */

const $scroll  = () => document.getElementById('scroll');
const $choices = () => document.getElementById('choices');
const $hud     = () => document.getElementById('hud');

let delayStep = 0;   // 当前场景内的淡入节拍

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

/** 滚到底部（元素在淡入，故多补几拍） */
function scrollToEnd() {
  [60, 260, 560].forEach(d => setTimeout(() => {
    const s = $scroll();
    s.scrollTo({ top: s.scrollHeight, behavior: 'instant' });
  }, d));
}

/** 按节拍淡入追加 */
function appear(node) {
  node.style.animationDelay = Math.min(delayStep * 0.13, 1.3) + 's';
  delayStep++;
  $scroll().appendChild(node);
  return node;
}

// ── HUD ────────────────────────────────────────────────
function updateHUD() {
  const hud = $hud();
  if (!state.name) { hud.classList.remove('on'); return; }
  hud.classList.add('on');

  const need = expNeed();
  const pct = need === Infinity ? 0 : Math.min(100, state.exp / need * 100);
  const mindWarn = state.mind < 30 ? ' warn' : '';
  const ageWarn  = state.age > lifespan() * 0.8 ? ' warn' : '';

  hud.innerHTML =
    '<div class="chapter">' + state.chapter + '</div>' +
    '<div class="row" style="margin-top:6px">' +
      '<span class="stat">境界 <b>' + realmName() + '</b></span>' +
      '<span class="stat' + ageWarn + '">年岁 <b>' + state.age + '</b> / ' + lifespan() + '</span>' +
      '<span class="stat' + mindWarn + '">心境 <b>' + state.mind + '</b></span>' +
      '<span class="stat">灵石 <b>' + state.stones + '</b></span>' +
    '</div>' +
    '<div id="expbar"><i style="width:' + pct + '%"></i></div>';
}

// ── 场景渲染 ───────────────────────────────────────────
function goto(id) {
  const sc = SCENES[id];
  if (!sc) { console.error('缺少场景：' + id); return; }

  state.scene = id;
  state.turns++;
  delayStep = 0;

  const sr = $scroll();
  sr.innerHTML = '';
  $choices().innerHTML = '';
  sr.scrollTo({ top: 0, behavior: 'instant' });

  // 进场效果
  if (sc.onEnter) {
    const deltas = applyEff(sc.onEnter);
    if (deltas.length) pendingDeltas = deltas;
  }

  if (sc.title) appear(el('div', 'scene-title', fill(sc.title)));

  // 正文
  (sc.text || []).forEach(t => {
    let cls = 'para', body = t;
    if (Array.isArray(t)) { cls = 'para ' + t[0]; body = t[1]; }
    appear(el('p', cls, fill(body)));
  });

  // 进场数值变动
  if (pendingDeltas) { showDeltas(pendingDeltas); pendingDeltas = null; }

  updateHUD();
  saveGame('auto');

  // 交互区
  if (sc.input)        renderInput(sc);
  else if (sc.choices) renderChoices(sc);
  else if (sc.next)    renderNext(sc);
  else if (sc.ending)  renderEnding(sc);
}

let pendingDeltas = null;

function showDeltas(deltas) {
  if (!deltas || !deltas.length) return;
  const html = deltas.map(d => '<span class="' + d.cls + '">' + d.txt + '</span>').join('　');
  appear(el('div', 'delta', html));
}

// ── 选项 ───────────────────────────────────────────────
function renderChoices(sc) {
  const box = $choices();
  const base = Math.min(delayStep * 0.13, 1.3) + 0.15;

  sc.choices.forEach((c, i) => {
    if (c.hide && c.hide(state)) return;             // 完全不显示
    const ok = !c.cond || c.cond(state);
    const b = el('button', 'choice' + (ok ? '' : ' locked'));
    b.innerHTML = '<span>' + fill(c.t) + '</span>' +
      (c.hint ? '<span class="hint">' + fill(c.hint) + '</span>'
              : (!ok && c.lock ? '<span class="hint">' + fill(c.lock) + '</span>' : ''));
    b.style.animationDelay = (base + i * 0.08) + 's';
    if (ok) b.onclick = () => pick(c);
    box.appendChild(b);
  });
}

function pick(c) {
  $choices().innerHTML = '';

  // 有判定：先展示明骰，再走分支
  if (c.roll) {
    const r = doRoll(c.roll);
    const parts = r.parts.map(p => p[0] + ' ' + (p[1] >= 0 ? '+' : '') + p[1]).join('　');
    appear(el('div', 'roll',
      '〔<span class="label">判定 · ' + r.label + '</span>〕难度 ' + r.dc + '<br>' +
      '底子 ' + r.base + '　' + parts + '　＝ <b>' + r.total + '</b><br>' +
      (r.win ? '<span class="win">— 成 —</span>'
             : '<span class="lose">— 败（差 ' + (r.dc - r.total) + '）—</span>')
    ));
    const branch = r.win ? c.win : c.lose;
    const eff = r.win ? c.winEff : c.loseEff;
    showDeltas(applyEff(c.eff));
    showDeltas(applyEff(eff));
    updateHUD();
    scrollToEnd();
    renderNext({ next: branch, nextLabel: '继 续' });
    return;
  }

  const deltas = applyEff(c.eff);
  showDeltas(deltas);
  updateHUD();

  if (deltas.length) {
    // 让变动被看见，再进入下一幕
    scrollToEnd();
    renderNext({ next: c.to, nextLabel: '继 续' });
  } else {
    goto(c.to);
  }
}

// ── 继续 ───────────────────────────────────────────────
function renderNext(sc) {
  const b = el('button', 'next', sc.nextLabel || '继 续');
  b.style.animationDelay = Math.min(delayStep * 0.13, 1.3) + 0.2 + 's';
  b.onclick = () => goto(typeof sc.next === 'function' ? sc.next(state) : sc.next);
  $choices().appendChild(b);
}

// ── 输入（捏人）─────────────────────────────────────────
function renderInput(sc) {
  const box = $choices();
  const wrap = el('div');
  wrap.innerHTML =
    '<input id="ipt" maxlength="' + (sc.input.max || 8) + '" placeholder="' + sc.input.ph + '" ' +
    'style="width:100%;padding:13px 14px;background:var(--paper-2);border:1px solid var(--line);' +
    'border-left:2px solid var(--gold-dim);color:var(--text);font-family:var(--serif);font-size:16px;' +
    'outline:none;border-radius:0">';
  box.appendChild(wrap);

  const b = el('button', 'next', '定 名');
  b.style.animationDelay = '0.1s';
  b.onclick = () => {
    const v = document.getElementById('ipt').value.trim();
    if (!v) { document.getElementById('ipt').focus(); return; }
    state[sc.input.key] = v;
    goto(sc.to);
  };
  box.appendChild(b);
  document.getElementById('ipt').addEventListener('keydown', e => {
    if (e.key === 'Enter') b.click();
  });
}

// ── 结局 ───────────────────────────────────────────────
function renderEnding(sc) {
  const b = el('button', 'next', '此生已尽 · 重来');
  b.style.animationDelay = Math.min(delayStep * 0.13, 1.3) + 0.4 + 's';
  b.onclick = () => location.reload();
  $choices().appendChild(b);
}

// ── 档案弹层 ───────────────────────────────────────────
function openProfile() {
  const m = document.getElementById('modal');
  const items = Object.keys(state.items).length
    ? Object.entries(state.items).map(([k, v]) => k + (v > 1 ? ' ×' + v : '')).join('、')
    : '身无长物';
  const npcs = Object.keys(state.npc).length
    ? Object.entries(state.npc).map(([k, v]) => '<div class="kv"><span>' + k + '</span>' + v + '</div>').join('')
    : '<div class="note">尚无深交之人。</div>';

  m.innerHTML =
    '<h3>生 平</h3>' +
    '<div class="kv"><span>姓名</span>' + state.name + '（' + state.gender + '）</div>' +
    '<div class="kv"><span>性情</span>' + state.nature + '</div>' +
    '<div class="kv"><span>境界</span>' + realmName() +
      (expNeed() === Infinity ? '' : '　修为 ' + state.exp + '/' + expNeed()) + '</div>' +
    '<div class="kv"><span>年岁</span>' + state.age + ' 岁　寿元 ' + lifespan() + '</div>' +
    '<div class="kv"><span>心境</span>' + state.mind + ' / 100</div>' +
    '<div class="kv"><span>悟性</span>' + witsName() + '</div>' +
    '<div class="kv"><span>体魄</span>' + bodyName() + '</div>' +
    '<div class="kv"><span>灵石</span>' + state.stones + ' 枚</div>' +
    '<div class="sect">随 身</div><div class="note">' + items + '</div>' +
    '<div class="sect">羁 绊</div>' + npcs +
    '<button class="close">合 上</button>';
  m.classList.add('on');
  m.querySelector('.close').onclick = () => m.classList.remove('on');
}

// ── 启动 ───────────────────────────────────────────────
function startNew() {
  state = S0();
  document.getElementById('title').classList.add('gone');
  goto('p_start');
}

function continueGame() {
  if (!loadGame('auto')) return;
  document.getElementById('title').classList.add('gone');
  goto(state.scene);
}

window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('btn-new').onclick = startNew;
  const bc = document.getElementById('btn-continue');
  if (hasSave('auto')) bc.onclick = continueGame;
  else bc.disabled = true;
  document.getElementById('btn-profile').onclick = openProfile;
});

</script>
