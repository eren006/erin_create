<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>长日 · 系统文档</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --black: #0C0B09;
  --cream: #F7F4EE;
  --warm-white: #FDFBF7;
  --gold: #B89A6A;
  --gold-light: #D4B896;
  --gold-dim: rgba(184,154,106,0.15);
  --muted: #7A7570;
  --border: #E2DDD5;
  --green: #4A7C5E;
  --red: #8B3A3A;
  --blue: #3A5F8B;
}

html, body { height: 100%; }
body { font-family: 'Noto Serif SC', serif; background: var(--black); color: var(--cream); overflow-x: hidden; line-height: 1.7; display: flex; flex-direction: column; }

/* ── BACKGROUND ─── */
.bg-grid { position: fixed; inset: 0; background-image: radial-gradient(circle, rgba(184,154,106,0.07) 1px, transparent 1px); background-size: 28px 28px; pointer-events: none; z-index: 0; }
.bg-vignette { position: fixed; inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(12,11,9,0.7) 100%); pointer-events: none; z-index: 0; }

/* ── MAIN ─── */
main { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 24px; min-height: 100vh; }

/* ── EYEBROW ─── */
.eyebrow { font-family: 'Cormorant Garamond', serif; font-size: 11px; letter-spacing: 6px; text-transform: uppercase; color: var(--gold); margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
.eyebrow::before, .eyebrow::after { content: ''; flex: 1; max-width: 60px; height: 1px; background: var(--gold); opacity: 0.4; }

/* ── TITLE ─── */
.title { font-family: 'Playfair Display', serif; font-size: clamp(52px, 10vw, 96px); line-height: 0.95; text-align: center; color: var(--cream); margin-bottom: 12px; letter-spacing: -1px; }
.title em { font-style: italic; color: var(--gold-light); display: block; }

.subtitle { font-family: 'Cormorant Garamond', serif; font-size: 16px; color: rgba(247,244,238,0.45); letter-spacing: 2px; text-align: center; margin-bottom: 64px; }

/* ── CARDS ─── */
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; width: 100%; max-width: 860px; }

.card { position: relative; border: 1px solid rgba(184,154,106,0.25); background: rgba(247,244,238,0.03); padding: 36px 32px 32px; cursor: pointer; transition: border-color 0.25s, background 0.25s, transform 0.2s; text-decoration: none; display: flex; flex-direction: column; gap: 0; overflow: hidden; }
.card::before, .card::after { content: ''; position: absolute; width: 12px; height: 12px; pointer-events: none; transition: width 0.25s, height 0.25s; }
.card::before { top: -1px; left: -1px; border-top: 1px solid var(--gold); border-left: 1px solid var(--gold); }
.card::after { bottom: -1px; right: -1px; border-bottom: 1px solid var(--gold); border-right: 1px solid var(--gold); }
.card:hover { border-color: rgba(184,154,106,0.55); background: rgba(184,154,106,0.06); transform: translateY(-3px); }
.card:hover::before, .card:hover::after { width: 20px; height: 20px; }

/* shimmer */
.card-shimmer { position: absolute; top: 0; left: -150%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(184,154,106,0.08), transparent); transform: skewX(-20deg); pointer-events: none; }
.card:hover .card-shimmer { animation: shimmer 0.55s ease forwards; }
@keyframes shimmer { from { left: -150%; } to { left: 190%; } }

.card-icon { font-size: 28px; margin-bottom: 18px; line-height: 1; }
.card-label { font-family: 'Cormorant Garamond', serif; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.card-title { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--cream); margin-bottom: 10px; line-height: 1.2; }
.card-desc { font-family: 'Cormorant Garamond', serif; font-size: 14px; color: rgba(247,244,238,0.5); line-height: 1.75; flex: 1; }
.card-arrow { margin-top: 24px; font-family: 'Cormorant Garamond', serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: rgba(184,154,106,0.5); display: flex; align-items: center; gap: 6px; transition: color 0.2s, gap 0.2s; }
.card:hover .card-arrow { color: var(--gold); gap: 10px; }

/* lock badge */
.lock-badge { display: inline-flex; align-items: center; gap: 4px; font-family: 'Cormorant Garamond', serif; font-size: 9.5px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(184,154,106,0.6); border: 1px solid rgba(184,154,106,0.25); padding: 1px 7px; border-radius: 2px; }

/* version chip */
.version-chip { position: absolute; top: 14px; right: 16px; font-family: 'Courier New', monospace; font-size: 9px; letter-spacing: 1.5px; color: rgba(184,154,106,0.35); }

/* ── FOOTER ─── */
footer { position: relative; z-index: 1; text-align: center; padding: 28px; font-family: 'Cormorant Garamond', serif; font-size: 12px; letter-spacing: 2px; color: rgba(247,244,238,0.2); border-top: 1px solid rgba(184,154,106,0.12); }

/* ── PASSWORD MODAL ─── */
.modal-overlay { position: fixed; inset: 0; background: rgba(12,11,9,0.88); z-index: 200; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; backdrop-filter: blur(4px); }
.modal-overlay.open { opacity: 1; pointer-events: all; }

.modal { background: var(--black); border: 1px solid rgba(184,154,106,0.35); padding: 44px 40px 36px; width: 100%; max-width: 380px; position: relative; }
.modal::before { content: ''; position: absolute; top: -1px; left: -1px; width: 16px; height: 16px; border-top: 1px solid var(--gold); border-left: 1px solid var(--gold); }
.modal::after { content: ''; position: absolute; bottom: -1px; right: -1px; width: 16px; height: 16px; border-bottom: 1px solid var(--gold); border-right: 1px solid var(--gold); }

.modal-eyebrow { font-family: 'Cormorant Garamond', serif; font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
.modal-title { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--cream); margin-bottom: 6px; }
.modal-desc { font-family: 'Cormorant Garamond', serif; font-size: 13px; color: rgba(247,244,238,0.4); margin-bottom: 28px; line-height: 1.6; }

.modal-input-wrap { position: relative; margin-bottom: 8px; }
.modal-input { width: 100%; background: rgba(247,244,238,0.05); border: 1px solid rgba(184,154,106,0.3); color: var(--cream); font-family: 'Courier New', monospace; font-size: 15px; letter-spacing: 3px; padding: 12px 16px; outline: none; transition: border-color 0.15s; }
.modal-input:focus { border-color: var(--gold); }
.modal-input.error { border-color: var(--red); animation: shake 0.35s ease; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

.modal-error { font-family: 'Cormorant Garamond', serif; font-size: 12px; letter-spacing: 1px; color: #c97070; height: 16px; margin-bottom: 20px; transition: opacity 0.15s; }

.modal-btn { width: 100%; background: var(--gold); border: none; color: var(--black); font-family: 'Cormorant Garamond', serif; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; padding: 13px; cursor: pointer; transition: background 0.15s; }
.modal-btn:hover { background: var(--gold-light); }

.modal-close { position: absolute; top: 14px; right: 16px; background: none; border: none; color: rgba(247,244,238,0.3); font-size: 18px; cursor: pointer; line-height: 1; transition: color 0.15s; }
.modal-close:hover { color: rgba(247,244,238,0.7); }

/* ── SCANLINE ─── */
.scanline { position: fixed; top: 0; left: 0; right: 0; height: 1.5px; background: linear-gradient(90deg, transparent 0%, rgba(212,184,150,0) 8%, rgba(212,184,150,0.6) 50%, rgba(184,154,106,0) 92%, transparent 100%); pointer-events: none; z-index: 10; animation: scan 2.5s ease-out 0.3s 1 forwards; opacity: 0; }
@keyframes scan { 0% { top: 0; opacity: 0; } 5% { opacity: 1; } 95% { opacity: 0.4; } 100% { top: 100vh; opacity: 0; } }

/* ── RESPONSIVE ─── */
@media (max-width: 700px) {
  .cards { grid-template-columns: 1fr; max-width: 420px; }
  .title { font-size: clamp(44px, 14vw, 72px); }
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-vignette"></div>
<div class="scanline"></div>

<main>
  <div class="eyebrow">Changri System</div>
  <h1 class="title">长日<em>文档</em></h1>
  <p class="subtitle">v1.3.6 &nbsp;·&nbsp; 系统文档中心</p>

  <div class="cards">

    <!-- 玩家指南 -->
    <a class="card" href="changriGuide.html">
      <div class="card-shimmer"></div>
      <div class="card-icon">📖</div>
      <div class="card-label">Player Guide</div>
      <div class="card-title">玩家指南</div>
      <div class="card-desc">注册角色、发起约会、使用道具、参与心愿与论坛，新玩家入门必读。</div>
      <div class="card-arrow">进入 →</div>
    </a>

    <!-- 管理指南（加密） -->
    <div class="card" onclick="openModal('managementGuide.html', '管理员指南', '包含开场流程、系统配置与运营参数，仅限管理员查阅。')">
      <div class="card-shimmer"></div>
      <div class="version-chip">🔒 restricted</div>
      <div class="card-icon">⚙️</div>
      <div class="card-label"><span class="lock-badge">🔒 需要密码</span></div>
      <div class="card-title">管理指南</div>
      <div class="card-desc">开场流程、群号配置、参数调整、每日运营参考，管理员专用。</div>
      <div class="card-arrow">进入 →</div>
    </div>

    <!-- 更新日志（加密） -->
    <div class="card" onclick="openModal('changelog.html', '更新日志', '记录各版本功能变更，仅限管理员查阅。')">
      <div class="card-shimmer"></div>
      <div class="version-chip">🔒 restricted</div>
      <div class="card-icon">📋</div>
      <div class="card-label"><span class="lock-badge">🔒 需要密码</span></div>
      <div class="card-title">更新日志</div>
      <div class="card-desc">记录每个版本的功能新增、问题修复与结构调整，当前版本 v1.3.6。</div>
      <div class="card-arrow">进入 →</div>
    </div>

  </div>
</main>

<footer>长日系统 &nbsp;·&nbsp; v1.3.6</footer>

<!-- ── PASSWORD MODAL ─── -->
<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-eyebrow">Access Required</div>
    <div class="modal-title" id="modal-title">管理员指南</div>
    <div class="modal-desc" id="modal-desc">此页面仅限管理员访问，请输入密码继续。</div>
    <div class="modal-input-wrap">
      <input class="modal-input" id="modal-input" type="password" placeholder="••••••" autocomplete="off"
             onkeydown="if(event.key==='Enter')submitPassword()" oninput="clearError()">
    </div>
    <div class="modal-error" id="modal-error"></div>
    <button class="modal-btn" onclick="submitPassword()">确认进入</button>
  </div>
</div>

<script>
const PASSWORD = 'ra9';
let targetUrl = '';

function openModal(url, title, desc) {
  targetUrl = url;
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-desc').textContent = desc;
  document.getElementById('modal-input').value = '';
  document.getElementById('modal-error').textContent = '';
  document.getElementById('modal-input').classList.remove('error');
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('modal-input').focus(), 80);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  targetUrl = '';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

function clearError() {
  document.getElementById('modal-error').textContent = '';
  document.getElementById('modal-input').classList.remove('error');
}

function submitPassword() {
  const val = document.getElementById('modal-input').value;
  if (val === PASSWORD) {
    const url = targetUrl;
    closeModal();
    window.location.href = url;
  } else {
    const input = document.getElementById('modal-input');
    const err   = document.getElementById('modal-error');
    input.classList.remove('error');
    void input.offsetWidth;
    input.classList.add('error');
    err.textContent = '密码错误，请重试';
    input.value = '';
    setTimeout(() => input.focus(), 50);
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});
</script>
</body>
</html>
