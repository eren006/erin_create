{# 地图：后台「地点」页里拼好并勾了「玩家可见」的示意图。只读，可缩放；渲染器跟后台编辑器是同一份。 #}
{% include "_place_map_render.html" %}
<style>
.mp-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 10px var(--gutter, 18px) 6px; scrollbar-width: none; }
.mp-tabs::-webkit-scrollbar { display: none; }
.mp-tabs button { flex: none; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; min-height: 36px; }
.mp-tabs button[aria-pressed="true"] { background: var(--mine); border-color: var(--mine); color: var(--mine-text); }
.mp-stage { margin: 8px var(--gutter, 18px) 0; border: 1px solid var(--line); border-radius: 14px; overflow: auto; background: #efe8d6; -webkit-overflow-scrolling: touch; }
.mp-stage svg { display: block; }
.mp-zoom { display: flex; gap: 8px; justify-content: flex-end; margin: 8px var(--gutter, 18px) 0; }
.mp-zoom button { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 10px; width: 44px; height: 40px; font-size: 18px; cursor: pointer; }
.mp-info { margin: 10px var(--gutter, 18px) 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--theirs); font-size: 14px; line-height: 1.7; }
.mp-info b { display: block; font-size: 15px; }
.mp-info span { color: var(--muted); }
.mp-note { padding: 10px var(--gutter, 18px) 24px; font-size: 12px; color: var(--muted); line-height: 1.7; }
</style>
<header class="bar">
  <a class="back" href="{{ url_for('player_discover') }}">发现</a>
  <div class="title">地图</div>
  <div class="right"></div>
</header>
<div class="scroll">
  {% if place_maps %}
  <div class="mp-tabs" id="mpTabs" role="group" aria-label="选择地点"></div>
  <div class="mp-stage" id="mpStage"></div>
  <div class="mp-info" id="mpInfo" hidden><b id="mpInfoName"></b><span id="mpInfoDesc"></span></div>
  <div class="mp-zoom"><button type="button" id="mpOut" aria-label="缩小">−</button><button type="button" id="mpIn" aria-label="放大">＋</button></div>
  <div class="mp-note">点地图上的地点可以看介绍；点 ＋ − 缩放，放大后可以拖动查看。{% if phone_admin %}（管理视角：没勾「玩家可见」的也能看到）{% endif %}</div>
  <script>
  (function () {
    var maps = {{ place_maps|tojson }}, info = {{ place_info|tojson }}, names = Object.keys(maps), cur = names[0], zoom = 1, picked = null;
    var tabs = document.getElementById('mpTabs'), stage = document.getElementById('mpStage');
    function show() {
      var c = maps[cur];
      var ov = '';
      if (picked) ov = '<rect x="' + picked.x * PlaceMap.C + '" y="' + picked.y * PlaceMap.C + '" width="' + picked.w * PlaceMap.C + '" height="' + picked.h * PlaceMap.C + '" fill="rgba(107,91,181,.18)" stroke="#6b5bb5" stroke-width="3"/>';
      stage.innerHTML = PlaceMap.render(c, { overlay: ov });
      var svg = stage.querySelector('svg');
      svg.style.maxWidth = 'none'; svg.style.width = (zoom * 100) + '%'; svg.style.height = 'auto';
      tabs.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.n === cur ? 'true' : 'false'); });
    }
    names.forEach(function (n) {
      var b = document.createElement('button'); b.type = 'button'; b.dataset.n = n; b.textContent = n;
      b.onclick = function () { cur = n; picked = null; document.getElementById('mpInfo').hidden = true; show(); }; tabs.appendChild(b);
    });
    // 点地图上关联了地点的区块：高亮并显示地点名称和描述
    stage.addEventListener('click', function (e) {
      var svg = stage.querySelector('svg'), r = svg.getBoundingClientRect(), c = maps[cur];
      var cx = Math.floor((e.clientX - r.left) / r.width * c.w), cy = Math.floor((e.clientY - r.top) / r.height * c.h), best = null;
      (c.items || []).forEach(function (it) {
        if (it.t === 'rect' && it.place && cx >= it.x && cx < it.x + it.w && cy >= it.y && cy < it.y + it.h) {
          if (!best || PlaceMap.KINDS[it.kind].layer >= PlaceMap.KINDS[best.kind].layer) best = it;
        }
      });
      var box = document.getElementById('mpInfo');
      picked = best; box.hidden = !best;
      if (best) { document.getElementById('mpInfoName').textContent = best.place; document.getElementById('mpInfoDesc').textContent = info[best.place] || '（暂无描述）'; }
      show();
    });
    document.getElementById('mpIn').onclick = function () { zoom = Math.min(4, zoom + .5); show(); };
    document.getElementById('mpOut').onclick = function () { zoom = Math.max(1, zoom - .5); show(); };
    show();
  })();
  </script>
  {% else %}
  <div class="mp-note" style="text-align:center;padding-top:48px;">还没有可以查看的地图。</div>
  {% endif %}
</div>
