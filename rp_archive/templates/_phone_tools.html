<div class="tools-toast" id="toolsToast" role="status" hidden></div>
<script>
(function () {
  const scope = {{ [sid, owner]|tojson }}, key = 'phone:saved:' + JSON.stringify(scope);
  let saved = [], storageOK = true, records = [], pageSize = 60;
  const library = document.getElementById('library'), toast = document.getElementById('toolsToast');
  let toastTimer;
  function say(text) {
    toast.textContent = text; toast.hidden = false; clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.hidden = true; }, 3500);
  }
  function loadSaved() {
    saved = []; storageOK = true;
    try {
      const value = JSON.parse(localStorage.getItem(key) || '[]');
      if (Array.isArray(value)) saved = Array.from(new Set(value.filter(x => typeof x === 'string' && /^[a-f0-9]{32}$/.test(x))));
    } catch (_) { storageOK = false; }
  }
  function paintSaved() {
    document.querySelectorAll('[data-save-key]').forEach(function (b) {
      const on = saved.includes(b.dataset.saveKey);
      b.textContent = b.closest('.msg') ? (on ? '★' : '☆') : (on ? '★ 已收藏' : '☆ 收藏');
      b.setAttribute('aria-pressed', String(on));
      b.setAttribute('aria-label', on ? '取消收藏这条记录' : '收藏这条记录');
    });
  }
  function toggleSaved(id) {
    loadSaved();
    if (!storageOK) { say('当前浏览器无法保存收藏'); return; }
    const next = saved.includes(id) ? saved.filter(x => x !== id) : saved.concat([id]);
    if (next.length > 1000) { say('收藏已满，先移除一些记录'); return; }
    try { localStorage.setItem(key, JSON.stringify(next)); }
    catch (_) { say('收藏没有保存成功，请检查浏览器存储空间'); return; }
    saved = next; paintSaved();
    if (library) render();
    say(saved.includes(id) ? '已收藏到这台设备' : '已取消收藏');
  }
  function element(tag, className, text) {
    const e = document.createElement(tag); e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function render() {
    const query = document.getElementById('messageQuery').value.trim().toLocaleLowerCase();
    const other = document.getElementById('messageContact').value, day = document.getElementById('messageDay').value;
    const result = records.filter(r => (library.dataset.view !== 'saved' || saved.includes(r.key))
      && (!other || r.other === other) && (!day || r.day === day)
      && (!query || [r.text,r.gift_name,r.other,r.signature].join('\n').toLocaleLowerCase().includes(query)));
    const container = document.getElementById('libraryResults'); container.replaceChildren();
    document.getElementById('libraryState').textContent = !storageOK && library.dataset.view === 'saved'
      ? '当前浏览器无法读取本机收藏。'
      : result.length ? '找到 ' + result.length + ' 条记录'
      : library.dataset.view === 'saved' && !saved.length ? '还没有收藏。在对话里点 ☆，留下喜欢的那一句。' : '没有符合条件的记录';
    result.slice(0,pageSize).forEach(function (r) {
      const card = element('article','library-card');
      card.appendChild(element('span','record-title',r.other + (r.mine ? ' · 我发出的' : ' · 收到的')));
      card.appendChild(element('div','record-meta',[r.day,r.time].filter(Boolean).join(' ')));
      if (r.kind === 'gift') card.appendChild(element('div','record-text','🎁 ' + r.gift_name));
      if (r.text) card.appendChild(element('div','record-text',r.text));
      const actions = element('div','record-actions'), link = element('a','','回到对话');
      link.href = r.url;
      const button = element('button','save-message'); button.type = 'button'; button.dataset.saveKey = r.key;
      actions.append(link,button); card.appendChild(actions); container.appendChild(card);
    });
    document.getElementById('libraryMore').hidden = result.length <= pageSize;
    paintSaved();
  }
  async function loadRecords() {
    document.getElementById('libraryRetry').hidden = true;
    document.getElementById('libraryState').textContent = '正在整理记录…';
    try {
      const response = await fetch({{ url_for('player_phone_library_data')|tojson }}, {cache:'no-store'});
      if (response.status === 401) { location.assign({{ url_for('phone_code_entry')|tojson }}); return; }
      if (!response.ok) throw Error();
      records = (await response.json()).records.sort((a,b) => b.ts-a.ts);
      [['messageContact','other','全部联系人'],['messageDay','day','全部游戏日']].forEach(function ([id,field,label]) {
        const select = document.getElementById(id), old = select.value;
        select.replaceChildren(new Option(label,''));
        Array.from(new Set(records.map(r => r[field]).filter(Boolean))).sort().forEach(v => select.add(new Option(v,v)));
        select.value = old;
      });
      const preset = new URLSearchParams(location.search).get('other');
      if (preset && records.some(r=>r.other===preset)) document.getElementById('messageContact').value = preset;
      render();
    } catch (_) {
      document.getElementById('libraryState').textContent = '暂时加载不了，稍后再试。';
      document.getElementById('libraryRetry').hidden = false;
    }
  }
  loadSaved(); paintSaved();
  document.addEventListener('click', function (e) { const b=e.target.closest('[data-save-key]'); if(b)toggleSaved(b.dataset.saveKey); });
  document.addEventListener('phone:updated',paintSaved);
  window.addEventListener('storage',function(e){if(e.key===key||e.key===null){loadSaved();paintSaved();if(library)render();}});
  if (library) {
    ['messageQuery','messageContact','messageDay'].forEach(id=>document.getElementById(id).addEventListener('input',function(){pageSize=60;render();}));
    document.getElementById('libraryMore').addEventListener('click',function(){pageSize+=60;render();});
    document.getElementById('libraryRetry').addEventListener('click',loadRecords);
    loadRecords();
  }
  function jumpToRecord() {
    if (!/^#message-[a-f0-9]{32}$/.test(location.hash)) return;
    const target=document.getElementById(location.hash.slice(1));
    if(target)requestAnimationFrame(()=>target.scrollIntoView({block:'center'}));
  }
  jumpToRecord(); window.addEventListener('hashchange',jumpToRecord);
  const dock = document.querySelector('.bottom-dock');
  if (dock) {
    const measureDock = () => document.querySelector('.phone').style.setProperty('--dock-height', dock.getBoundingClientRect().height + 'px');
    measureDock();
    new ResizeObserver(measureDock).observe(dock);
  }
  const menu = document.getElementById('threadMenu');
  if (menu) {
    document.getElementById('threadMenuOpen').addEventListener('click',()=>menu.showModal());
    document.getElementById('threadMenuClose').addEventListener('click',()=>menu.close());
    if (!location.hash) requestAnimationFrame(function () {
      const sc=document.getElementById('scroll'); sc.scrollTop=sc.scrollHeight;
      if (innerWidth<600) window.scrollTo(0,document.scrollingElement.scrollHeight);
    });
  }
  const plus=document.getElementById('dockPlus'), mcOpen=document.getElementById('mcOpen');
  if(plus && plus.dataset.moments==='1' && mcOpen) plus.addEventListener('click',e=>{ e.preventDefault(); mcOpen.click(); });
  const momentDock=document.getElementById('momentDock'), publish=document.getElementById('mcOpen');
  if(momentDock && publish) {
    publish.className='primary-action'; publish.removeAttribute('style'); publish.textContent='＋ 发朋友圈';
    momentDock.appendChild(publish);
  }
})();
</script>
