<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ show.name }} · 长日存档{% endblock %}</title>
<style>
:root {
  --bg: #0f0f13;
  --surface: #1a1a22;
  --surface2: #22222e;
  --border: #2e2e3e;
  --accent: #8b7cf6;
  --accent2: #c084fc;
  --text: #e2e2ec;
  --muted: #7878a0;
  --red: #f87171;
  --green: #86efac;
  --gold: #fcd34d;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px; line-height: 1.7; min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent2); }

.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  display: flex; align-items: center; gap: 12px;
  height: 52px; position: sticky; top: 0; z-index: 100;
  overflow-x: auto; overflow-y: hidden;
}
.topbar::-webkit-scrollbar { display: none; }
.topbar .logo { font-size: 15px; font-weight: 600; color: var(--accent2); white-space: nowrap; flex-shrink: 0; }
.topbar .show-name { font-size: 13px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
.topbar .nav { display: flex; gap: 4px; flex-shrink: 0; }
.topbar .nav a { color: var(--muted); font-size: 13px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
.topbar .nav a:hover { color: var(--text); background: var(--surface2); }
.readonly-badge {
  font-size: 11px; color: var(--muted); background: var(--surface2);
  border: 1px solid var(--border); border-radius: 20px; padding: 2px 10px; white-space: nowrap;
  flex-shrink: 0; margin-left: auto;
}

.page { max-width: 1100px; margin: 0 auto; padding: 28px 20px; }
.page-title {
  font-size: 20px; font-weight: 600; color: var(--accent2);
  margin-bottom: 20px; padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px 20px; margin-bottom: 14px;
  transition: border-color .2s;
}
.card:hover { border-color: var(--accent); }
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.card-meta { color: var(--muted); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
.card-meta span { display: flex; align-items: center; gap: 4px; }

.tag {
  display: inline-block; padding: 2px 9px; border-radius: 20px;
  font-size: 11px; font-weight: 600;
}
.tag-private  { background: #2d1f4e; color: #c084fc; }
.tag-call     { background: #1a2d3a; color: #60c8ff; }
.tag-official { background: #1f2d1a; color: #86efac; }
.tag-forced   { background: #3a1a1a; color: #f87171; }

.pill {
  display: inline-block; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 20px; padding: 2px 10px; font-size: 12px; color: var(--muted);
  margin: 2px;
}

.empty { color: var(--muted); text-align: center; padding: 48px 0; font-size: 14px; }
[data-theme=spring]{--bg:#0f0a10;--surface:#1a1020;--surface2:#22152a;--border:#3e2040;--accent:#f472b6;--accent2:#e879f9;--text:#fce7f3;--muted:#a07898}
[data-theme=summer]{--bg:#080f10;--surface:#0d1a1c;--surface2:#122225;--border:#1a3a40;--accent:#06b6d4;--accent2:#22d3ee;--text:#e0f7fa;--muted:#507880}
[data-theme=autumn]{--bg:#100a04;--surface:#1c1008;--surface2:#261508;--border:#4a2a08;--accent:#f59e0b;--accent2:#f97316;--text:#fef3c7;--muted:#907050}
[data-theme=winter]{--bg:#080b0f;--surface:#0d1520;--surface2:#111e2c;--border:#1c3048;--accent:#7dd3fc;--accent2:#93c5fd;--text:#e0eeff;--muted:#4a7090}
[data-theme=monet]{--bg:#0a0c10;--surface:#12181f;--surface2:#19222e;--border:#283848;--accent:#a8d8ea;--accent2:#d4b5d0;--text:#e5eef5;--muted:#608098;--red:#fca5a5}
[data-theme=detroit]{--bg:#07090c;--surface:#0e1218;--surface2:#141b24;--border:#1e2a38;--accent:#00b4ff;--accent2:#33ccff;--text:#c8d8e8;--muted:#4a6070;--red:#ff1744;--green:#00e676;--gold:#ffd740}
[data-theme=spring-day]{--bg:#fef2f8;--surface:#fce7f4;--surface2:#f9d0e8;--border:#f0a8d0;--accent:#db2777;--accent2:#be185d;--text:#1f0610;--muted:#9d5a7a;--red:#dc2626;--green:#15803d;--gold:#b45309}
[data-theme=summer-day]{--bg:#f0faff;--surface:#e0f5ff;--surface2:#c8ecfc;--border:#7dd3f0;--accent:#0284c7;--accent2:#0ea5e9;--text:#082030;--muted:#3e7a94;--red:#dc2626;--green:#15803d;--gold:#b45309}
[data-theme=autumn-day]{--bg:#fffbf0;--surface:#fef6e4;--surface2:#feebc8;--border:#fbbf60;--accent:#b45309;--accent2:#c2410c;--text:#1c0d00;--muted:#92632e;--red:#dc2626;--green:#15803d;--gold:#b45309}
[data-theme=winter-day]{--bg:#f0f8ff;--surface:#e2f0ff;--surface2:#cce4fa;--border:#8ec8f0;--accent:#1d6fa0;--accent2:#2779bd;--text:#0a1828;--muted:#4a7a98;--red:#dc2626;--green:#15803d;--gold:#b45309}
[data-theme=monet-day]{--bg:#f5f7fa;--surface:#eaf1f8;--surface2:#d8e8f5;--border:#a8c8e0;--accent:#4a8fa8;--accent2:#8a6aaa;--text:#18283a;--muted:#5c7d90;--red:#c05050;--green:#2d7a50;--gold:#9a7020}
:is([data-theme=spring-day],[data-theme=summer-day],[data-theme=autumn-day],[data-theme=winter-day],[data-theme=monet-day]) .tag-private{background:#f3e8ff;color:#7c3aed}
:is([data-theme=spring-day],[data-theme=summer-day],[data-theme=autumn-day],[data-theme=winter-day],[data-theme=monet-day]) .tag-call{background:#e0f2fe;color:#0369a1}
:is([data-theme=spring-day],[data-theme=summer-day],[data-theme=autumn-day],[data-theme=winter-day],[data-theme=monet-day]) .tag-official{background:#dcfce7;color:#15803d}
:is([data-theme=spring-day],[data-theme=summer-day],[data-theme=autumn-day],[data-theme=winter-day],[data-theme=monet-day]) .tag-forced{background:#fee2e2;color:#dc2626}
</style>
<script>(function(){var t=localStorage.getItem('rp_theme');if(t&&t!=='default')document.documentElement.setAttribute('data-theme',t)})()</script>
{% block head %}{% endblock %}
</head>
<body>
<div class="topbar">
  <span class="logo">📖 {{ show.name }}</span>
  <span class="show-name">长日存档 · 公开视图</span>
  <nav class="nav">
    <a href="/view/{{ token }}">场次</a>
  </nav>
  <span class="readonly-badge">只读</span>
</div>
{% block body %}{% endblock %}
<div id="tp"><button id="tp-btn" onclick="document.getElementById('tp-panel').classList.toggle('open')" title="切换主题">🎨</button><div id="tp-panel"><div class="tp-item" onclick="setTheme('default')"><span class="tp-dot" style="background:#8b7cf6"></span>默认</div><div class="tp-item" onclick="setTheme('spring')"><span class="tp-dot" style="background:#f472b6"></span>春 · 樱</div><div class="tp-item" onclick="setTheme('summer')"><span class="tp-dot" style="background:#06b6d4"></span>夏 · 海</div><div class="tp-item" onclick="setTheme('autumn')"><span class="tp-dot" style="background:#f59e0b"></span>秋 · 枫</div><div class="tp-item" onclick="setTheme('winter')"><span class="tp-dot" style="background:#7dd3fc"></span>冬 · 冰</div><div class="tp-item" onclick="setTheme('monet')"><span class="tp-dot" style="background:#a8d8ea"></span>莫奈</div><div class="tp-item" onclick="setTheme('detroit')"><span class="tp-dot" style="background:#00b4ff"></span>底特律</div><div class="tp-sep">日间 ☀</div><div class="tp-item" onclick="setTheme('spring-day')"><span class="tp-dot" style="background:#db2777"></span>春 · 樱</div><div class="tp-item" onclick="setTheme('summer-day')"><span class="tp-dot" style="background:#0284c7"></span>夏 · 海</div><div class="tp-item" onclick="setTheme('autumn-day')"><span class="tp-dot" style="background:#b45309"></span>秋 · 枫</div><div class="tp-item" onclick="setTheme('winter-day')"><span class="tp-dot" style="background:#1d6fa0"></span>冬 · 冰</div><div class="tp-item" onclick="setTheme('monet-day')"><span class="tp-dot" style="background:#4a8fa8"></span>莫奈</div></div></div>
<style>
#tp{position:fixed;bottom:20px;right:20px;z-index:9999}
#tp-btn{background:var(--surface);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.5)}
#tp-btn:hover{border-color:var(--accent)}
#tp-panel{display:none;position:absolute;bottom:48px;right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px;min-width:150px;box-shadow:0 4px 20px rgba(0,0,0,.6)}
#tp-panel.open{display:block}
.tp-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text)}
.tp-item:hover{background:var(--surface2)}
.tp-item.tp-active{color:var(--accent)}
.tp-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;outline:2px solid transparent;outline-offset:2px}
.tp-item.tp-active .tp-dot{outline-color:var(--accent)}
.tp-sep{font-size:11px;color:var(--muted);text-align:center;padding:5px 0 3px;margin-top:4px;border-top:1px solid var(--border)}
</style>
<script>
const _THEMES=['default','spring','summer','autumn','winter','monet','detroit','spring-day','summer-day','autumn-day','winter-day','monet-day'];
function setTheme(t){
  if(t==='default')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('rp_theme',t);
  document.querySelectorAll('.tp-item').forEach((el,i)=>el.classList.toggle('tp-active',_THEMES[i]===t));
  document.getElementById('tp-panel').classList.remove('open');
}
(function(){
  const t=localStorage.getItem('rp_theme')||'default';
  if(t!=='default')document.documentElement.setAttribute('data-theme',t);
  document.querySelectorAll('.tp-item').forEach((el,i)=>el.classList.toggle('tp-active',_THEMES[i]===t));
})();
document.addEventListener('click',function(e){if(!document.getElementById('tp').contains(e.target))document.getElementById('tp-panel').classList.remove('open')});
</script>
</body>
</html>
