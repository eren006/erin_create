{# 地点示意图编辑器（弹窗）：在格子上自己拼——画房间/建筑/广场/草地/水域/道路区块，放门，放小标记。
   手指和鼠标都能用（pointer 事件）。保存到 site_config.place_maps（只在网页端，不下发给机器人）。 #}
{% include "_place_map_render.html" %}
<style>
.pm-back { position: fixed; inset: 0; z-index: 9500; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; padding: 14px; }
.pm-back.open { display: flex; }
.pm-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 920px; max-height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.pm-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.pm-head h3 { font-size: 15px; flex: 1; min-width: 120px; }
.pm-body { overflow: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
.pm-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pm-bar button, .pm-bar select, .pm-bar input { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-family: inherit; cursor: pointer; }
.pm-bar button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.pm-bar button.pri { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.pm-bar button.del { color: var(--red); }
.pm-bar input[type=number] { width: 64px; cursor: text; }
.pm-bar input[type=text] { width: 150px; cursor: text; }
.pm-bar .sp { flex: 1; }
.pm-bar label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.pm-stage { border: 1px solid var(--border); border-radius: 10px; overflow: auto; background: #efe8d6; touch-action: none; max-height: 60vh; }
.pm-stage svg { touch-action: none; user-select: none; -webkit-user-select: none; }
.pm-tip { font-size: 12px; color: var(--muted); line-height: 1.7; }
@media (max-width: 720px) { .pm-back { padding: 0; } .pm-box { max-width: none; height: 100%; border-radius: 0; border: 0; } .pm-bar input[type=text] { width: 100%; } }
</style>
<div class="pm-back" id="pmBack">
  <div class="pm-box">
    <div class="pm-head">
      <h3 id="pmTitle">🗺 地图</h3>
      <label style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;"><input type="checkbox" id="pmVisible"> 玩家在小手机里可见</label>
      <button class="btn-sm pri" id="pmSave" style="background:var(--accent);color:#fff;border-color:var(--accent);">保存</button>
      <button class="btn-sm" id="pmClose">关闭</button>
    </div>
    <div class="pm-body">
      <div class="pm-bar" id="pmTools">
        <button data-tool="select" class="on">👆 选择/移动</button>
        <button data-tool="rect">▭ 画区块</button>
        <select id="pmKind"></select>
        <button data-tool="door">🚪 门</button>
        <button data-tool="mark">📍 标记</button>
        <select id="pmIcon"></select>
        <span class="sp"></span>
        <button id="pmUndo">↩ 撤销</button>
      </div>
      <div class="pm-bar" id="pmSel" style="display:none;">
        <span style="font-size:12px;color:var(--muted);">选中：</span>
        <input type="text" id="pmName" maxlength="20" placeholder="名称（如 客厅）">
        <select id="pmSelKind"></select>
        <select id="pmSelIcon" style="display:none;"></select>
        <button id="pmDup">复制</button>
        <button id="pmDel" class="del">删除</button>
      </div>
      <div class="pm-stage" id="pmStage"></div>
      <div class="pm-bar">
        <label>宽 <input type="number" id="pmW" min="6" max="60"> 格</label>
        <label>高 <input type="number" id="pmH" min="6" max="60"> 格</label>
        <button id="pmClear" class="del">清空</button>
        <span class="sp"></span>
        <button id="pmDlSvg">下载 SVG</button>
        <button id="pmDlPng">下载 PNG</button>
        <button id="pmRemove" class="del">删除这张地图</button>
      </div>
      <div class="pm-tip">
        <b>怎么拼：</b>选「画区块」，在格子上拖出一个矩形（房间、建筑、广场、草地、水域、道路）；选中后改名字或类型，拖动移动，拖右下角缩放。
        「门」点在两个房间之间的墙边；「标记」点一格放个小图标。房屋就用「房间」拼，城市就用「建筑」+「道路」+「广场」拼。
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  var PM = window.PlaceMap, C = PM.C;
  var ICONS = ['🔑', '🪜', '🛏️', '🍳', '🚽', '🛁', '🪑', '📚', '⛲', '🌳', '⛪', '🏰', '🏪', '🍺', '⚔️', '💰', '🚪', '❓', '📍'];
  var maps = {{ (place_maps or {})|tojson }};
  var cur = null, name = '', cfg = null, tool = 'select', sel = -1, hist = [], drag = null, preview = null;
  var $ = function (id) { return document.getElementById(id); };

  function fill(sel_, pairs) { sel_.innerHTML = pairs.map(function (p) { return '<option value="' + p[0] + '">' + p[1] + '</option>'; }).join(''); }
  var kindPairs = Object.keys(PM.KINDS).map(function (k) { return [k, PM.KINDS[k].label]; });
  fill($('pmKind'), kindPairs.filter(function (p) { return true; })); $('pmKind').value = 'room';
  fill($('pmSelKind'), kindPairs);
  var iconPairs = ICONS.map(function (i) { return [i, i]; });
  fill($('pmIcon'), iconPairs); fill($('pmSelIcon'), iconPairs);

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function snap() { hist.push(JSON.stringify({ w: cfg.w, h: cfg.h, items: cfg.items })); if (hist.length > 60) hist.shift(); }
  function undo() {
    if (!hist.length) return;
    var s = JSON.parse(hist.pop()); cfg.w = s.w; cfg.h = s.h; cfg.items = s.items; sel = -1; sync(); draw();
  }

  function overlay() {
    var o = '';
    if (sel >= 0 && cfg.items[sel]) {
      var it = cfg.items[sel];
      if (it.t === 'rect') {
        o += '<rect x="' + it.x * C + '" y="' + it.y * C + '" width="' + it.w * C + '" height="' + it.h * C + '" fill="none" stroke="#8b7cf6" stroke-width="3" stroke-dasharray="6 4"/>';
        o += '<rect x="' + ((it.x + it.w) * C - 12) + '" y="' + ((it.y + it.h) * C - 12) + '" width="12" height="12" fill="#8b7cf6"/>';
      } else if (it.t === 'mark') {
        o += '<rect x="' + it.x * C + '" y="' + it.y * C + '" width="' + C + '" height="' + C + '" fill="none" stroke="#8b7cf6" stroke-width="3" stroke-dasharray="6 4"/>';
      }
    }
    if (preview) o += '<rect x="' + preview.x * C + '" y="' + preview.y * C + '" width="' + preview.w * C + '" height="' + preview.h * C + '" fill="rgba(139,124,246,.25)" stroke="#8b7cf6" stroke-width="2"/>';
    return o;
  }
  function draw() { $('pmStage').innerHTML = PM.render(cfg, { grid: true, overlay: overlay() }); }

  function sync() {   // 选中项 → 属性栏
    var it = sel >= 0 ? cfg.items[sel] : null, bar = $('pmSel');
    bar.style.display = it && (it.t === 'rect' || it.t === 'mark') ? '' : 'none';
    if (!it) return;
    var isRect = it.t === 'rect';
    $('pmSelKind').style.display = isRect ? '' : 'none';
    $('pmSelIcon').style.display = isRect ? 'none' : '';
    $('pmName').placeholder = isRect ? '名称（如 客厅）' : '备注（可空，如 钥匙）';
    $('pmName').value = isRect ? (it.name || '') : (it.label || '');
    if (isRect) $('pmSelKind').value = it.kind; else $('pmSelIcon').value = it.icon;
    $('pmW').value = cfg.w; $('pmH').value = cfg.h;
  }

  function cellAt(e) {
    var svg = $('pmStage').querySelector('svg'), r = svg.getBoundingClientRect();
    var fx = (e.clientX - r.left) / r.width * cfg.w, fy = (e.clientY - r.top) / r.height * cfg.h;
    return { cx: Math.max(0, Math.min(cfg.w - 1, Math.floor(fx))), cy: Math.max(0, Math.min(cfg.h - 1, Math.floor(fy))), fx: fx, fy: fy };
  }
  function hit(cx, cy) {   // 最上面的东西：标记 > 区块（后画的、层高的在上）
    for (var i = cfg.items.length - 1; i >= 0; i--) { var m = cfg.items[i]; if (m.t === 'mark' && m.x === cx && m.y === cy) return i; }
    var best = -1, bl = -1;
    cfg.items.forEach(function (it, i) {
      if (it.t === 'rect' && cx >= it.x && cx < it.x + it.w && cy >= it.y && cy < it.y + it.h) {
        var l = PM.KINDS[it.kind].layer * 1000 + i; if (l > bl) { bl = l; best = i; }
      }
    });
    return best;
  }
  function defaultName(kind) { return { room: '房间', building: '建筑', plaza: '广场', road: '', green: '', water: '' }[kind] || ''; }

  var stage = $('pmStage');
  stage.addEventListener('pointerdown', function (e) {
    if (!cfg) return;
    var p = cellAt(e);
    if (tool === 'rect') {
      drag = { mode: 'draw', x0: p.cx, y0: p.cy }; preview = { x: p.cx, y: p.cy, w: 1, h: 1 };
      stage.setPointerCapture(e.pointerId); draw(); e.preventDefault(); return;
    }
    if (tool === 'door') {
      var u = p.fx - p.cx, v = p.fy - p.cy, d = [v, 1 - v, u, 1 - u], mi = d.indexOf(Math.min.apply(null, d));
      var door = mi === 0 ? { x: p.cx, y: p.cy, o: 'h' } : mi === 1 ? { x: p.cx, y: p.cy + 1, o: 'h' } : mi === 2 ? { x: p.cx, y: p.cy, o: 'v' } : { x: p.cx + 1, y: p.cy, o: 'v' };
      snap();
      var ex = cfg.items.findIndex(function (it) { return it.t === 'door' && it.x === door.x && it.y === door.y && it.o === door.o; });
      if (ex >= 0) cfg.items.splice(ex, 1); else { door.t = 'door'; cfg.items.push(door); }
      sel = -1; sync(); draw(); return;
    }
    if (tool === 'mark') {
      snap(); cfg.items.push({ t: 'mark', x: p.cx, y: p.cy, icon: $('pmIcon').value, label: '' });
      sel = cfg.items.length - 1; setTool('select'); sync(); draw(); return;
    }
    // 选择/移动/缩放
    var i = hit(p.cx, p.cy);
    if (i >= 0 && i === sel && cfg.items[i].t === 'rect') {
      var it = cfg.items[i];
      if (p.cx === it.x + it.w - 1 && p.cy === it.y + it.h - 1 && (p.fx - p.cx) > .4 && (p.fy - p.cy) > .4) {
        snap(); drag = { mode: 'resize' }; stage.setPointerCapture(e.pointerId); e.preventDefault(); return;
      }
    }
    sel = i; sync();
    if (i >= 0) { snap(); var m = cfg.items[i]; drag = { mode: 'move', dx: p.cx - m.x, dy: p.cy - m.y }; stage.setPointerCapture(e.pointerId); e.preventDefault(); }
    draw();
  });
  stage.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var p = cellAt(e);
    if (drag.mode === 'draw') {
      var x = Math.min(drag.x0, p.cx), y = Math.min(drag.y0, p.cy);
      preview = { x: x, y: y, w: Math.abs(p.cx - drag.x0) + 1, h: Math.abs(p.cy - drag.y0) + 1 }; draw();
    } else if (drag.mode === 'move') {
      var it = cfg.items[sel], w = it.t === 'rect' ? it.w : 1, h = it.t === 'rect' ? it.h : 1;
      var nx = Math.max(0, Math.min(cfg.w - w, p.cx - drag.dx)), ny = Math.max(0, Math.min(cfg.h - h, p.cy - drag.dy));
      if (nx !== it.x || ny !== it.y) { it.x = nx; it.y = ny; draw(); }
    } else if (drag.mode === 'resize') {
      var r = cfg.items[sel], nw = Math.max(1, p.cx - r.x + 1), nh = Math.max(1, p.cy - r.y + 1);
      if (nw !== r.w || nh !== r.h) { r.w = nw; r.h = nh; draw(); }
    }
  });
  function end() {
    if (!drag) return;
    if (drag.mode === 'draw' && preview) {
      snap(); var k = $('pmKind').value;
      cfg.items.push({ t: 'rect', kind: k, x: preview.x, y: preview.y, w: preview.w, h: preview.h, name: defaultName(k) });
      sel = cfg.items.length - 1; preview = null; setTool('select'); sync();
    }
    drag = null; draw();
  }
  stage.addEventListener('pointerup', end);
  window.addEventListener('pointerup', end);      // 在区块外松手也要收尾
  window.addEventListener('mouseup', end);
  stage.addEventListener('pointercancel', function () { preview = null; drag = null; draw(); });

  function setTool(t) {
    tool = t;
    document.querySelectorAll('#pmTools [data-tool]').forEach(function (b) { b.classList.toggle('on', b.dataset.tool === t); });
  }
  document.querySelectorAll('#pmTools [data-tool]').forEach(function (b) { b.onclick = function () { setTool(b.dataset.tool); if (tool !== 'select') { sel = -1; sync(); draw(); } }; });
  $('pmUndo').onclick = undo;
  $('pmName').oninput = function () {
    var it = cfg.items[sel]; if (!it) return;
    if (it.t === 'rect') it.name = this.value; else it.label = this.value; draw();
  };
  $('pmSelKind').onchange = function () { var it = cfg.items[sel]; if (it && it.t === 'rect') { snap(); it.kind = this.value; draw(); } };
  $('pmSelIcon').onchange = function () { var it = cfg.items[sel]; if (it && it.t === 'mark') { snap(); it.icon = this.value; draw(); } };
  $('pmDel').onclick = function () { if (sel < 0) return; snap(); cfg.items.splice(sel, 1); sel = -1; sync(); draw(); };
  $('pmDup').onclick = function () {
    var it = cfg.items[sel]; if (!it) return; snap();
    var c = clone(it); c.x = Math.min(cfg.w - (c.w || 1), c.x + 1); c.y = Math.min(cfg.h - (c.h || 1), c.y + 1);
    cfg.items.push(c); sel = cfg.items.length - 1; sync(); draw();
  };
  $('pmClear').onclick = function () { if (!cfg.items.length || !confirm('清空这张地图上的所有内容？（可以用「撤销」找回）')) return; snap(); cfg.items = []; sel = -1; sync(); draw(); };
  function resizeGrid() {
    var w = Math.max(6, Math.min(60, +$('pmW').value || cfg.w)), h = Math.max(6, Math.min(60, +$('pmH').value || cfg.h));
    if (w === cfg.w && h === cfg.h) return;
    snap(); cfg.w = w; cfg.h = h;
    cfg.items = cfg.items.filter(function (it) { return it.x < w && it.y < h; });   // 缩小后超出的丢掉，rect 超出的裁剪
    cfg.items.forEach(function (it) { if (it.t === 'rect') { it.w = Math.min(it.w, w - it.x); it.h = Math.min(it.h, h - it.y); } });
    sel = -1; sync(); draw();
  }
  $('pmW').onchange = resizeGrid; $('pmH').onchange = resizeGrid;

  function download(filename, blob) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function plainSvg() { return PM.render(cfg, {}); }
  $('pmDlSvg').onclick = function () { download(name + '.svg', new Blob([plainSvg()], { type: 'image/svg+xml' })); };
  $('pmDlPng').onclick = function () {
    var img = new Image(), url = URL.createObjectURL(new Blob([plainSvg()], { type: 'image/svg+xml' }));
    img.onload = function () {
      var cv = document.createElement('canvas'); cv.width = cfg.w * C * 2; cv.height = cfg.h * C * 2;
      var g = cv.getContext('2d'); g.drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      cv.toBlob(function (b) { download(name + '.png', b); });
    };
    img.src = url;
  };

  async function postMap(data) {
    var fd = new FormData(); for (var k in data) fd.append(k, data[k]);
    var r = await fetch("{{ url_for('admin_places') }}", { method: 'POST', headers: { 'X-Fetch': '1' }, body: fd });
    return r.json();
  }
  $('pmSave').onclick = async function () {
    var data = { w: cfg.w, h: cfg.h, items: cfg.items, visible: $('pmVisible').checked };
    var res = await postMap({ action: 'save_map', name: name, map: JSON.stringify(data) });
    if (res.ok) { maps[name] = data; refreshBtn(name); if (window.showBanner) showBanner('地图已保存'); close_(); }
    else alert('保存失败：' + (res.error || '未知原因'));
  };
  $('pmRemove').onclick = async function () {
    if (!maps[name]) { close_(); return; }
    if (!confirm('删除「' + name + '」的地图？')) return;
    var res = await postMap({ action: 'delete_map', name: name });
    if (res.ok) { delete maps[name]; refreshBtn(name); close_(); }
  };
  function refreshBtn(n) {
    document.querySelectorAll('[data-map-btn]').forEach(function (b) { if (b.dataset.mapBtn === n) b.textContent = maps[n] ? '🗺 地图 ✓' : '🗺 地图'; });
  }
  function close_() { $('pmBack').classList.remove('open'); cfg = null; }
  $('pmClose').onclick = function () { if (!hist.length || confirm('有没保存的改动，确定关闭？')) close_(); };

  window.openMapEditor = function (n) {
    name = n; hist = []; sel = -1; preview = null; drag = null; setTool('select');
    var m = maps[n];
    cfg = m ? clone(m) : { w: 20, h: 14, items: [], visible: false };
    cfg.items = cfg.items || [];
    $('pmTitle').textContent = '🗺 ' + n;
    $('pmVisible').checked = !!cfg.visible;
    $('pmW').value = cfg.w; $('pmH').value = cfg.h;
    sync(); draw(); $('pmBack').classList.add('open');
  };
})();
</script>
