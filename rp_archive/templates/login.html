<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>长日存档 · 登录</title>
<style>
:root {
  --bg:#0f0f13; --surface:#1a1a22; --border:#2e2e3e;
  --accent:#8b7cf6; --accent2:#c084fc; --text:#e2e2ec; --muted:#7878a0; --red:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;align-items:center;justify-content:center;min-height:100vh;}
.box{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:40px 36px;width:100%;max-width:340px;
}
@media(max-width:400px){.box{padding:32px 20px;border-radius:12px;}}
.logo{text-align:center;font-size:22px;font-weight:700;color:var(--accent2);margin-bottom:6px;}
.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:28px;}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;margin-top:14px;}
label:first-of-type{margin-top:0;}
input[type=text], input[type=password]{
  width:100%;background:#22222e;border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:10px 14px;font-size:14px;
}
input[type=text]:focus, input[type=password]:focus{outline:none;border-color:var(--accent);}
.btn{
  width:100%;margin-top:20px;background:var(--accent);color:#fff;border:none;
  border-radius:8px;padding:11px;font-size:14px;cursor:pointer;font-weight:600;
}
.btn:hover{background:var(--accent2);}
.error{color:var(--red);font-size:13px;margin-top:12px;text-align:center;}
[data-theme=spring]{--bg:#0f0a10;--surface:#1a1020;--surface2:#22152a;--border:#3e2040;--accent:#f472b6;--accent2:#e879f9;--text:#fce7f3;--muted:#a07898}
[data-theme=summer]{--bg:#080f10;--surface:#0d1a1c;--surface2:#122225;--border:#1a3a40;--accent:#06b6d4;--accent2:#22d3ee;--text:#e0f7fa;--muted:#507880}
[data-theme=autumn]{--bg:#100a04;--surface:#1c1008;--surface2:#261508;--border:#4a2a08;--accent:#f59e0b;--accent2:#f97316;--text:#fef3c7;--muted:#907050}
[data-theme=winter]{--bg:#080b0f;--surface:#0d1520;--surface2:#111e2c;--border:#1c3048;--accent:#7dd3fc;--accent2:#93c5fd;--text:#e0eeff;--muted:#4a7090}
[data-theme=monet]{--bg:#0a0c10;--surface:#12181f;--surface2:#19222e;--border:#283848;--accent:#a8d8ea;--accent2:#d4b5d0;--text:#e5eef5;--muted:#608098}
[data-theme=detroit]{--bg:#07090c;--surface:#0e1218;--surface2:#141b24;--border:#1e2a38;--accent:#00b4ff;--accent2:#33ccff;--text:#c8d8e8;--muted:#4a6070;--red:#ff1744}
[data-theme=spring-day]{--bg:#fef2f8;--surface:#fce7f4;--surface2:#f9d0e8;--border:#f0a8d0;--accent:#db2777;--accent2:#be185d;--text:#1f0610;--muted:#9d5a7a;--red:#dc2626}
[data-theme=summer-day]{--bg:#f0faff;--surface:#e0f5ff;--surface2:#c8ecfc;--border:#7dd3f0;--accent:#0284c7;--accent2:#0ea5e9;--text:#082030;--muted:#3e7a94;--red:#dc2626}
[data-theme=autumn-day]{--bg:#fffbf0;--surface:#fef6e4;--surface2:#feebc8;--border:#fbbf60;--accent:#b45309;--accent2:#c2410c;--text:#1c0d00;--muted:#92632e;--red:#dc2626}
[data-theme=winter-day]{--bg:#f0f8ff;--surface:#e2f0ff;--surface2:#cce4fa;--border:#8ec8f0;--accent:#1d6fa0;--accent2:#2779bd;--text:#0a1828;--muted:#4a7a98;--red:#dc2626}
[data-theme=monet-day]{--bg:#f5f7fa;--surface:#eaf1f8;--surface2:#d8e8f5;--border:#a8c8e0;--accent:#4a8fa8;--accent2:#8a6aaa;--text:#18283a;--muted:#5c7d90;--red:#c05050}
</style>
<script>(function(){var t=localStorage.getItem('rp_theme');if(t&&t!=='default')document.documentElement.setAttribute('data-theme',t)})()</script>
</head>
<body>
<div class="box">
  <div class="logo">📖 长日存档</div>
  {% if current_user %}
  <div style="text-align:center;font-size:12px;color:var(--muted);background:rgba(139,124,246,0.1);border:1px solid rgba(139,124,246,0.2);border-radius:6px;padding:6px 10px;margin-bottom:16px;">
    当前已登录：<span style="color:var(--accent);font-weight:600;">{{ current_user }}</span>
    　<a href="{{ url_for('home') }}" style="color:var(--accent2);text-decoration:none;">返回主页 →</a>
  </div>
  {% endif %}
  <div class="sub">请输入团账号与密码</div>
  <form method="post">
    <label>团账号</label>
    <input type="text" name="username" autofocus placeholder="账号名" autocomplete="username">
    <label>密码</label>
    <input type="password" name="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn" type="submit">进入</button>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </form>
  <div style="text-align:center;margin-top:20px;">
    <a href="{{ url_for('superadmin_login') }}"
       style="font-size:12px;color:var(--muted);text-decoration:none;">超级管理员入口</a>
  </div>
</div>
<div id="tp"><button id="tp-btn" onclick="document.getElementById('tp-panel').classList.toggle('open')" title="切换主题">🎨</button><div id="tp-panel"><div class="tp-item" onclick="setTheme('default')"><span class="tp-dot" style="background:#8b7cf6"></span>默认</div><div class="tp-item" onclick="setTheme('spring')"><span class="tp-dot" style="background:#f472b6"></span>春 · 樱</div><div class="tp-item" onclick="setTheme('summer')"><span class="tp-dot" style="background:#06b6d4"></span>夏 · 海</div><div class="tp-item" onclick="setTheme('autumn')"><span class="tp-dot" style="background:#f59e0b"></span>秋 · 枫</div><div class="tp-item" onclick="setTheme('winter')"><span class="tp-dot" style="background:#7dd3fc"></span>冬 · 冰</div><div class="tp-item" onclick="setTheme('monet')"><span class="tp-dot" style="background:#a8d8ea"></span>莫奈</div><div class="tp-item" onclick="setTheme('detroit')"><span class="tp-dot" style="background:#00b4ff"></span>底特律</div><div class="tp-sep">日间 ☀</div><div class="tp-item" onclick="setTheme('spring-day')"><span class="tp-dot" style="background:#db2777"></span>春 · 樱</div><div class="tp-item" onclick="setTheme('summer-day')"><span class="tp-dot" style="background:#0284c7"></span>夏 · 海</div><div class="tp-item" onclick="setTheme('autumn-day')"><span class="tp-dot" style="background:#b45309"></span>秋 · 枫</div><div class="tp-item" onclick="setTheme('winter-day')"><span class="tp-dot" style="background:#1d6fa0"></span>冬 · 冰</div><div class="tp-item" onclick="setTheme('monet-day')"><span class="tp-dot" style="background:#4a8fa8"></span>莫奈</div></div></div>
<style>
#tp{position:fixed;bottom:20px;right:20px;z-index:9999}
#tp-btn{background:var(--surface);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.5)}
#tp-btn:hover{border-color:var(--accent)}
#tp-panel{display:none;position:absolute;bottom:48px;right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px;min-width:150px;box-shadow:0 4px 20px rgba(0,0,0,.6)}
#tp-panel.open{display:block}
.tp-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text)}
.tp-item:hover{background:var(--surface2)}
.tp-item.tp-active{color:var(--accent)}
.tp-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;outline:2px solid transparent;outline-offset:2px}
.tp-item.tp-active .tp-dot{outline-color:var(--accent)}
.tp-sep{font-size:11px;color:var(--muted);text-align:center;padding:5px 0 3px;margin-top:4px;border-top:1px solid var(--border)}
</style>
<script>
const _THEMES=['default','spring','summer','autumn','winter','monet','detroit','spring-day','summer-day','autumn-day','winter-day','monet-day'];
function setTheme(t){
  if(t==='default')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('rp_theme',t);
  document.querySelectorAll('.tp-item').forEach((el,i)=>el.classList.toggle('tp-active',_THEMES[i]===t));
  document.getElementById('tp-panel').classList.remove('open');
}
(function(){
  const t=localStorage.getItem('rp_theme')||'default';
  if(t!=='default')document.documentElement.setAttribute('data-theme',t);
  document.querySelectorAll('.tp-item').forEach((el,i)=>el.classList.toggle('tp-active',_THEMES[i]===t));
})();
document.addEventListener('click',function(e){if(!document.getElementById('tp').contains(e.target))document.getElementById('tp-panel').classList.remove('open')});
</script>
</body>
</html>
