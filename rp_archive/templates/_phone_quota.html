{% if status and status.can and (status.sms or status.gift) %}<div class="quota">今日{% if status.sms %} 短信 <span class="{{ 'near-limit' if status.sms[1] - status.sms[0] <= 1 else '' }}">{{ status.sms[0] }}/{{ status.sms[1] }}</span>{% endif %}{% if status.sms and status.gift %} ·{% endif %}{% if status.gift %} 礼物 <span class="{{ 'near-limit' if status.gift[1] - status.gift[0] <= 1 else '' }}">{{ status.gift[0] }}/{{ status.gift[1] }}</span>{% endif %}</div>{% endif %}
