<style>
.pending-entry { display: flex; align-items: center; gap: 12px; margin: 0 16px 12px; padding: 14px; border: 1px solid #e5a18e; border-radius: 16px; background: #fff0eb; color: #9b3520; min-height: 64px; }
.pending-entry[hidden] { display: none; }
.pending-entry-dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.pending-entry-copy { flex: 1; min-width: 0; }
.pending-entry strong { display: block; font-size: 16px; }
.pending-entry small { display: block; font-size: 12px; margin-top: 5px; line-height: 1.6; }
.pending-entry.is-stale { background: var(--theirs); border-color: var(--line); color: var(--muted); }
@media (prefers-color-scheme: dark) { .pending-entry:not(.is-stale) { background: #351f20; color: #ffb4a0; border-color: #8e4b40; } }
</style>
{% set reminder = pending_summary or {'count':0, 'longest':'', 'stale':false} %}
<a href="{{ url_for('player_stats', view='pending') }}" class="pending-entry{% if reminder.stale %} is-stale{% endif %}" id="pendingEntry"{% if not reminder.count %} hidden{% endif %}>
  <span class="pending-entry-dot" aria-hidden="true"></span>
  <span class="pending-entry-copy"><strong id="pendingEntryTitle">{{ '待回记录' if reminder.stale else '待我回复' }} · {{ reminder.count }} 项</strong><small id="pendingEntryDetail">{% if reminder.stale %}同步延迟 · 请以最新回复情况为准{% elif reminder.longest %}最长已等待 {{ reminder.longest }}{% else %}有关系线等待回复{% endif %}</small></span>
  <span aria-hidden="true">›</span>
</a>
