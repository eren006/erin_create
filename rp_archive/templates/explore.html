<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>探索踩点</title></head>
<body>
{# 占位：由 Codex 按 docs/探索踩点_接口约定.md 重做（手机优先）。mode = entry | home #}
{% if mode == 'entry' %}
<h1>探索踩点</h1>{% if error %}<p>{{ error }}</p>{% endif %}
<form method="post"><input name="code" placeholder="激活码" autocomplete="off" required><button>进入</button></form>
{% else %}
<h1>探索踩点 · {{ role }}</h1>
<div id="app" data-csrf="{{ csrf }}" data-enabled="{{ 1 if enabled else 0 }}"></div>
<form method="post" action="{{ url_for('explore_logout') }}"><input type="hidden" name="csrf" value="{{ csrf }}"><button>退出</button></form>
{% endif %}
</body></html>
