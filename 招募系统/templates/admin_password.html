<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修改密码</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0ebe3; color: #2c1f14; min-height: 100vh; }
  .topbar { background: #2a1f16; color: #d4c4b0; padding: 0 32px; height: 52px; display: flex; align-items: center; justify-content: space-between; }
  .topbar h1 { font-size: 15px; letter-spacing: 3px; font-weight: 600; }
  .topbar a { font-size: 12px; color: #a89070; text-decoration: none; letter-spacing: 1px; transition: color 0.2s; }
  .topbar a:hover { color: #d4c4b0; }
  .container { max-width: 420px; margin: 48px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 12px; padding: 32px; box-shadow: 0 2px 16px rgba(60,30,10,0.07); }
  .card h2 { font-size: 17px; font-weight: 600; color: #3d2410; margin-bottom: 24px; letter-spacing: 1px; }
  .field { margin-bottom: 18px; }
  label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: #7a5c40; text-transform: uppercase; margin-bottom: 6px; }
  input { width: 100%; padding: 11px 14px; border: 1.5px solid #e0d5c5; border-radius: 8px; font-size: 15px; font-family: inherit; color: #2c1f14; background: #fdfaf6; outline: none; transition: border-color 0.2s; }
  input:focus { border-color: #b08060; background: #fff; }
  .error { background: #fde8e8; border: 1px solid #e8c0b0; color: #a03030; border-radius: 7px; padding: 10px 14px; font-size: 13px; margin-bottom: 18px; }
  .success { background: #e8f5ee; border: 1px solid #b0d8c0; color: #3a7a50; border-radius: 7px; padding: 10px 14px; font-size: 13px; margin-bottom: 18px; }
  .submit-btn { width: 100%; padding: 12px; background: #3d2410; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-family: inherit; font-weight: 600; letter-spacing: 2px; cursor: pointer; margin-top: 4px; transition: background 0.2s; }
  .submit-btn:hover { background: #5a3820; }
</style>
</head>
<body>
<div class="topbar">
  <h1>修改密码</h1>
  <a href="/admin">← 返回看板</a>
</div>
<div class="container">
  <div class="card">
    <h2>修改管理员密码</h2>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    {% if success %}<div class="success">密码已修改成功，请用新密码重新登录。</div>{% endif %}
    {% if not success %}
    <form method="POST">
      <div class="field">
        <label>当前密码</label>
        <input type="password" name="current" required autofocus>
      </div>
      <div class="field">
        <label>新密码</label>
        <input type="password" name="new_password" required placeholder="至少 6 位">
      </div>
      <div class="field">
        <label>确认新密码</label>
        <input type="password" name="confirm" required>
      </div>
      <button type="submit" class="submit-btn">确认修改</button>
    </form>
    {% endif %}
  </div>
</div>
</body>
</html>
