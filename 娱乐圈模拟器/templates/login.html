{% extends "base.html" %}
{% block title %}登录 - 娱乐圈模拟器{% endblock %}
{% block content %}
<div class="card" style="max-width:360px;margin:40px auto">
  <h3 style="margin-bottom:16px">登录</h3>
  {% if err %}<div class="flash flash-error">{{ err }}</div>{% endif %}
  <form method="post">
    <label>用户名</label>
    <input name="username" required>
    <label>密码</label>
    <input type="password" name="password" required>
    <button class="btn btn-primary" style="margin-top:16px;width:100%">登录</button>
  </form>
  <p class="muted" style="margin-top:12px">还没有账号? <a href="{{ url_for('register') }}">去注册</a></p>
</div>
{% endblock %}
