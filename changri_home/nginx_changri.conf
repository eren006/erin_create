# changri.work 按子域名分流（贾维斯 /etc/nginx/sites-available/changri）
# HTTPS 由 certbot --nginx 追加到本文件；X-Forwarded-For 直接覆盖为真实 IP，防伪造（应用取第一段作访问日志）

server {
    server_name changri.work www.changri.work;
    if ($scheme = http) { return 301 https://$host$request_uri; }
    root /var/www/changri;
    index index.html;
    charset utf-8;
    location / { try_files $uri $uri/ =404; }

    listen 80;
    listen [::]:80;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/changri.work/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/changri.work/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    listen 80;
    listen [::]:80;
    server_name order.changri.work;
    if ($scheme = http) { return 301 https://$host$request_uri; }
    client_max_body_size 50m;
    location / {
        proxy_pass http://127.0.0.1:5023;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/order.changri.work/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/order.changri.work/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

