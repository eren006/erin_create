server {
    listen 80;
    listen [::]:80;
    server_name news.changri.work;
    if ($scheme = http) { return 301 https://$host$request_uri; }
    root /var/www/market_daily;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_types application/json text/css application/javascript;
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/order.changri.work/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/order.changri.work/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


