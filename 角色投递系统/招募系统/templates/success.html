<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提交成功</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #f5f0ea;
    color: #2c1f14;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 56px 48px;
    box-shadow: 0 2px 16px rgba(60,30,10,0.07);
    text-align: center;
    max-width: 440px;
    width: 100%;
  }
  .icon {
    font-size: 48px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 3px;
    color: #3d2410;
    margin-bottom: 12px;
  }
  p {
    font-size: 14px;
    color: #8a7060;
    line-height: 1.8;
    margin-bottom: 32px;
  }
  a {
    display: inline-block;
    padding: 11px 32px;
    background: #f0e8dc;
    color: #7a5c40;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    transition: background 0.2s;
  }
  a:hover { background: #e0d5c5; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">✉</div>
  <h1>投递已收到</h1>
  <p>感谢您的投递，我们会在审阅后与您联系。<br>请耐心等待结果通知。</p>
  <a href="/">返回首页</a>
</div>
</body>
</html>
