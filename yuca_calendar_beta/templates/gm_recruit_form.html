{% extends "base.html" %}
{% block title %}发布招募 · 本主面板{% endblock %}
{% block body %}
<div class="page" style="max-width:600px">
  <a href="{{ url_for('gm_index') }}" style="font-size:12px;color:var(--muted)">&larr; 返回本主面板</a>
  <h1 class="page-title" style="margin-top:14px">发布招募</h1>

  <div class="card" style="margin-bottom:20px;font-size:13px;color:var(--muted);line-height:1.8">
    发布后将自动在招募广场展示，并在您的日历中加入一条 <strong style="color:var(--accent)">带本 / 已录取</strong> 档期。
  </div>

  {% if errors %}
  <div class="form-errors">{% for e in errors %}<div class="form-error">⚠ {{ e }}</div>{% endfor %}</div>
  {% endif %}

  <form method="post">
    <div class="form-group">
      <label class="form-label">剧名 <span class="req">*</span></label>
      <input class="form-input" type="text" name="title"
             value="{{ form.get('title','') }}" placeholder="这场戏的名字" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label">招募说明（选填）</label>
      <textarea class="form-textarea" name="description" rows="5"
                placeholder="剧情简介、角色需求、注意事项...">{{ form.get('description','') }}</textarea>
    </div>

    <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px">时间段</div>
    <div class="grid-2" style="margin-bottom:4px">
      <div class="form-group">
        <label class="form-label">开始年份 <span class="req">*</span></label>
        <input class="form-input" type="number" name="start_year"
               value="{{ form.get('start_year', default_year) }}" min="2020" max="2099">
      </div>
      <div class="form-group">
        <label class="form-label">时间段 <span class="req">*</span></label>
        <input class="form-input" type="text" name="time_range"
               value="{{ form.get('time_range','') }}"
               placeholder="MMDD MMDD，如 0315 0820" maxlength="9">
        <div class="form-hint">同年：0315 0820；跨年：1201 0201</div>
      </div>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">
      <button class="btn btn-primary" type="submit">发布招募</button>
      <a class="btn btn-ghost" href="{{ url_for('gm_index') }}">取消</a>
    </div>
  </form>
</div>
{% endblock %}
