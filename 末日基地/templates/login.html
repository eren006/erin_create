{% extends "base.html" %}
{% block title %}登录 - 末日基地{% endblock %}
{% block content %}
<div class="card">
  <h2 style="margin-bottom:12px">登录避难所</h2>
  <form method="post">
    <label>账号</label>
    <input name="username" required>
    <label>密码</label>
    <input name="password" type="password" required>
    <button class="btn btn-primary" style="margin-top:16px;width:100%" type="submit">登录</button>
  </form>
  <p class="muted" style="margin-top:12px">还没有幸存者档案?<a href="{{ url_for('register') }}">注册</a></p>
</div>
{% endblock %}
