{% extends 'base.html' %}
{% block title %}投诉举报{% endblock %}
{% block body %}
<h2>投诉举报</h2>
<p class="muted">发现违法违规、辱骂骚扰或侵权内容，可在这里向管理员举报。管理员核实后会删除相关内容、停用违规账号，处理结果会通过宫中消息告知你。</p>
<form method="post" action="{{ url_for('report') }}" class="sheet">
  {% if letter %}
  {% set f = get_consort(letter.from_id) %}
  <input type="hidden" name="letter" value="{{ letter.id }}">
  <p>被举报的信：<b>{{ dn(f) }}</b> 第 {{ letter.day }} 天所寄</p>
  <p class="body" style="white-space:pre-wrap;margin:0 0 12px;color:var(--muted)">{{ letter.body }}</p>
  {% endif %}
  <label for="category">举报类型</label>
  <select id="category" name="category" required>
    {% for cat in categories %}<option>{{ cat }}</option>{% endfor %}
  </select>
  <label for="reason">举报理由（最多 {{ REPORT_MAX_LEN }} 字）</label>
  <textarea id="reason" name="reason" maxlength="{{ REPORT_MAX_LEN }}" style="width:100%;min-height:90px" required></textarea>
  <div class="row" style="margin-top:10px"><button>提交举报</button></div>
</form>
{% endblock %}
