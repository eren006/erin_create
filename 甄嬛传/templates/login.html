{% extends 'base.html' %}
{% block title %}入宫{% endblock %}
{% block head %}
<style>
.arrival{display:grid;grid-template-columns:1fr 1fr;min-height:560px;border:1px solid var(--line);background:var(--paper);box-shadow:0 12px 36px var(--shadow)}
.arrival-scene{position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:36px;background:linear-gradient(180deg,rgba(20,39,31,.65),rgba(20,39,31,.08) 50%,rgba(20,39,31,.75)),var(--palace-art) center/cover;color:var(--ivory);border-right:4px double var(--jin)}
.arrival-seal{font-family:var(--kai);font-size:18px;writing-mode:vertical-rl;letter-spacing:.2em;border:3px double var(--roof);padding:14px 7px;background:var(--gate)}
.arrival-scene p{font-family:var(--kai);font-size:30px;letter-spacing:.12em;line-height:1.7;margin:0;text-shadow:0 2px 8px #14271f}
.arrival-form{align-self:center;padding:42px;min-width:0}
.arrival-eyebrow{font-size:12px;color:var(--jin);letter-spacing:.25em;margin-bottom:12px}
.arrival-form h2{font-size:36px;margin-bottom:12px}
.arrival-form form{margin-top:28px}
.arrival-form input{width:100%}
.arrival-form button{width:100%;margin-top:26px}
.arrival-register{text-align:center;margin:18px 0 0;font-size:14px}
@media(max-width:640px){.arrival{grid-template-columns:1fr;min-height:0}.arrival-scene{min-height:210px;padding:22px;flex-direction:row;align-items:flex-end;background-position:center 40%;border-right:0;border-bottom:4px double var(--jin)}.arrival-scene p{font-size:25px}.arrival-form{padding:28px 22px}.arrival-form h2{font-size:30px}.arrival-form form{margin-top:20px}}
</style>
{% endblock %}
{% block body %}
<section class="arrival" aria-label="入宫">
  <div class="arrival-scene" aria-hidden="true">
    <span class="arrival-seal">紫禁清梦</span>
    <p>一入宫门深似海<br>几度春秋，皆是故事</p>
  </div>
  <div class="arrival-form">
    <p class="arrival-eyebrow">甄嬛传 · 宫中旧事</p>
    <h2>入宫</h2>
    <p class="muted">新帝登基，宫中大选。<br>登录后回到你的宫苑。</p>
    <form method="post">
      <label for="u">账号</label><input id="u" name="username" required autocomplete="username" placeholder="你的入宫名册">
      <label for="p">密码</label><input id="p" name="password" type="password" required autocomplete="current-password" placeholder="请输入密码">
      <button>进宫</button>
      <p class="arrival-register"><a href="{{ url_for('register') }}">还没有账号？报名选秀</a></p>
    </form>
  </div>
</section>
{% endblock %}
