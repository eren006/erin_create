{% extends "base.html" %}
{% block title %}SQL 练习{% endblock %}
{% block content %}
<div class="practice-layout">
  <aside class="sidebar">
    <div class="engine-line">引擎状态: <span id="engine-status">加载中…</span></div>
    <ul id="question-list"></ul>
  </aside>
  <main class="main-panel">
    <h2 id="q-title"></h2>
    <p id="q-prompt"></p>
    <p id="q-hint"></p>
    <textarea id="code-input" spellcheck="false"></textarea>
    <div class="btn-row">
      <button id="run-btn">运行</button>
      <button id="check-btn">检查答案</button>
      <button id="solution-btn" class="secondary">显示参考答案</button>
    </div>
    <div id="feedback"></div>
    <div id="result-area"></div>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script src="{{ url_for('static', filename='js/sql_data.js') }}"></script>
<script src="{{ url_for('static', filename='js/sql_questions.js') }}"></script>
<script src="{{ url_for('static', filename='js/sql_practice.js') }}"></script>
{% endblock %}
