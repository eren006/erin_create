{% extends "web/base.html" %}
{% block title %}修改密码{% endblock %}
{% block body %}
<div class="card" style="max-width:400px;margin:20px auto">
  <h2>修改密码</h2>
  {% if account and account.must_change_password %}
    <p class="muted">还在用初始密码，先换一个吧。</p>
  {% endif %}
  <form method="post">
    <label>原密码</label>
    <input name="old" type="password" required style="width:100%">
    <label>新密码（至少6位）</label>
    <input name="new" type="password" required minlength="6" style="width:100%">
    <p><button type="submit" style="width:100%">保存</button></p>
  </form>
</div>
{% endblock %}
