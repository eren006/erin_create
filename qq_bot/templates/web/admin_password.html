{% extends "web/base.html" %}
{% block title %}修改管理密码{% endblock %}
{% block body %}
<div class="card" style="max-width:380px;margin:40px auto">
  <h2>修改管理密码</h2>
  <form method="post">
    <label>原管理密码</label>
    <input name="old" type="password" required style="width:100%">
    <label>新管理密码（至少6位）</label>
    <input name="new" type="password" required minlength="6" style="width:100%">
    <p><button type="submit" style="width:100%">保存</button></p>
  </form>
  <p class="muted"><a href="{{ url_for('admin') }}">返回管理后台</a></p>
</div>
{% endblock %}
