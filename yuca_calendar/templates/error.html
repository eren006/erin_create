{% extends "base.html" %}
{% block title %}{{ code }} · 语擦日历{% endblock %}
{% block body %}
<style>
.err-wrap { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.err-card { text-align: center; max-width: 400px; }
.err-code { font-size: 72px; font-weight: 700; color: var(--border); line-height: 1; margin-bottom: 16px; }
.err-msg { font-size: 16px; color: var(--muted); margin-bottom: 24px; }
</style>
<div class="err-wrap">
  <div class="err-card">
    <div class="err-code">{{ code }}</div>
    <div class="err-msg">{{ msg }}</div>
    <a href="{{ url_for('index') }}" class="btn btn-primary">返回首页</a>
  </div>
</div>
{% endblock %}
