{% extends 'base.html' %}
{% block title %}用户注册{% endblock %}
{% block body %}
<div class="page" style="max-width:460px;">
  <div class="page-title">注册账号</div>
  {% for e in errors %}<div class="err-msg">{{ e }}</div>{% endfor %}
  <div class="card">
    <form method="post">
      <div class="fg">
        <label class="fl">所属账户 <span class="req">*</span></label>
        <select name="tenant_id" class="fs" required>
          <option value="">— 请选择 —</option>
          {% for t in tenants %}
          <option value="{{ t.id }}" {% if request.form.get('tenant_id')==t.id|string %}selected{% endif %}>
            {{ t.display_name or t.slug }}
          </option>
          {% endfor %}
        </select>
        <span class="fh">选择你常用的接单方账户</span>
      </div>
      <div class="g2">
        <div class="fg">
          <label class="fl">用户名 <span class="req">*</span></label>
          <input class="fi" name="username" value="{{ request.form.get('username','') }}" placeholder="至少 3 个字符" autocomplete="username">
        </div>
        <div class="fg">
          <label class="fl">显示名称</label>
          <input class="fi" name="display_name" value="{{ request.form.get('display_name','') }}" placeholder="留空同用户名">
        </div>
      </div>
      <div class="fg">
        <label class="fl">密码 <span class="req">*</span></label>
        <input class="fi" type="password" name="password" placeholder="至少 6 个字符" autocomplete="new-password">
      </div>
      <div class="fg">
        <label class="fl">联系方式</label>
        <input class="fi" name="contact" value="{{ request.form.get('contact','') }}" placeholder="QQ / 微信 / 其他（方便管理员联系）">
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%;">注册</button>
    </form>
    <div style="margin-top:14px;font-size:12px;color:var(--muted);text-align:center;">
      已有账号？<a href="{{ url_for('user_login') }}">登录</a>
    </div>
  </div>
</div>
{% endblock %}
