{% extends 'base.html' %}
{% block title %}表单设计 · 排单宝{% endblock %}
{% block head %}
<style>
/* ── 布局 ── */
.fb-wrap{display:flex;gap:0;height:calc(100vh - 50px);overflow:hidden;}
.fb-canvas-col{flex:1;min-width:0;overflow-y:auto;padding:24px 20px;background:var(--bg);}
.fb-panel-col{width:300px;flex-shrink:0;border-left:1px solid var(--border);background:var(--surface);overflow-y:auto;display:flex;flex-direction:column;}
@media(max-width:820px){
  .fb-wrap{flex-direction:column;height:auto;overflow:visible;}
  .fb-panel-col{width:100%;border-left:none;border-top:1px solid var(--border);}
}

/* ── 画布 ── */
.fb-header{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.fb-header h2{font-size:16px;font-weight:700;color:var(--accent2);}
.fb-header .save-btn{margin-left:auto;}
.fb-canvas{min-height:200px;display:flex;flex-direction:column;gap:10px;}
.fb-empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:13px;border:2px dashed var(--border);border-radius:14px;line-height:2;}

/* ── 字段卡片 ── */
.fbc{
  background:var(--surface);border:1.5px solid var(--border);border-radius:12px;
  padding:14px 16px;display:flex;align-items:flex-start;gap:10px;
  transition:border-color .15s,box-shadow .15s,opacity .15s;
  position:relative;cursor:grab;user-select:none;
}
.fbc:active{cursor:grabbing;}
.fbc.dragging{opacity:.4;}
.fbc.drag-over{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent);}
.fbc.selected{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent);}
.fbc-drag{font-size:16px;color:var(--muted);cursor:grab;flex-shrink:0;margin-top:2px;line-height:1;}
.fbc-body{flex:1;min-width:0;}
.fbc-type{font-size:10px;color:var(--muted);letter-spacing:.05em;margin-bottom:2px;}
.fbc-label{font-size:14px;font-weight:600;color:var(--text);}
.fbc-label .req{color:var(--red);font-size:11px;margin-left:3px;}
.fbc-hint{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4;}
.fbc-opts{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px;}
.fbc-opt{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);}
.fbc-actions{display:flex;gap:4px;flex-shrink:0;}
.fbc-btn{width:26px;height:26px;border-radius:7px;border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--muted);transition:.15s;}
.fbc-btn:hover{background:var(--surface);color:var(--text);}
.fbc-btn.del:hover{background:color-mix(in srgb,var(--red) 10%,var(--surface));color:var(--red);}
.fbc-lock{font-size:10px;color:var(--muted);padding:2px 6px;background:var(--surface2);border-radius:5px;align-self:flex-start;}

/* ── 右侧面板 ── */
.panel-sec{padding:16px;border-bottom:1px solid var(--border);}
.panel-sec:last-child{border-bottom:none;}
.panel-title{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-bottom:10px;}
.palette-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.pal-item{
  background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  padding:8px 10px;cursor:pointer;transition:.15s;text-align:center;
}
.pal-item:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface2));}
.pal-icon{font-size:18px;display:block;margin-bottom:2px;}
.pal-name{font-size:11px;color:var(--muted);}

/* ── 字段编辑器 ── */
.editor-pane{padding:16px;display:none;flex-direction:column;gap:10px;}
.editor-pane.open{display:flex;}
.editor-pane .fg{margin-bottom:0;}
.editor-pane .fl{font-size:11px;}
.switch-row{display:flex;align-items:center;justify-content:space-between;}
.switch{position:relative;width:36px;height:20px;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;border-radius:20px;background:var(--border);cursor:pointer;transition:.2s;}
.slider::before{content:'';position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s;}
.switch input:checked + .slider{background:var(--accent);}
.switch input:checked + .slider::before{transform:translateX(16px);}
.opts-list{display:flex;flex-direction:column;gap:5px;margin-top:2px;}
.opt-row{display:flex;gap:5px;align-items:center;}
.opt-row .fi{flex:1;font-size:12px;padding:5px 8px;}
.opt-row .fbc-btn{flex-shrink:0;}
.add-opt-btn{font-size:12px;color:var(--accent2);cursor:pointer;padding:4px 0;background:none;border:none;font-family:inherit;text-align:left;}
.add-opt-btn:hover{color:var(--accent);}
.editor-close{font-size:12px;color:var(--muted);cursor:pointer;background:none;border:none;font-family:inherit;padding:0;margin-bottom:4px;display:flex;align-items:center;gap:4px;}
.editor-close:hover{color:var(--text);}

/* ── 保存提示 ── */
.save-bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:8px;align-items:center;}
.save-bar .unsaved{font-size:12px;color:var(--warn);flex:1;}
</style>
{% endblock %}
{% block body %}

<div class="fb-wrap">
  <!-- 左：画布 -->
  <div class="fb-canvas-col">
    <div class="fb-header">
      <h2>🧩 表单设计</h2>
      <span style="font-size:12px;color:var(--muted);">{{ tenant.display_name }}</span>
      <button class="btn btn-primary btn-sm save-btn" onclick="saveSchema()">保存</button>
      <button class="btn btn-ghost btn-sm" onclick="resetDefault()">恢复默认</button>
    </div>
    <div class="fb-canvas" id="canvas"></div>
  </div>

  <!-- 右：工具面板 -->
  <div class="fb-panel-col">
    <!-- 字段编辑器（选中字段后显示） -->
    <div class="panel-sec" id="editor-section" style="display:none;">
      <button class="editor-close" onclick="closeEditor()">← 返回组件列表</button>
      <div class="panel-title">编辑字段</div>
      <div class="editor-pane open" id="editor-pane"></div>
    </div>

    <!-- 组件面板 -->
    <div class="panel-sec" id="palette-section">
      <div class="panel-title">添加组件</div>
      <div class="palette-grid">
        <div class="pal-item" onclick="addField('short_text')"><span class="pal-icon">✏️</span><div class="pal-name">单行文字</div></div>
        <div class="pal-item" onclick="addField('textarea')"><span class="pal-icon">📄</span><div class="pal-name">多行文字</div></div>
        <div class="pal-item" onclick="addField('radio')"><span class="pal-icon">🔘</span><div class="pal-name">单选</div></div>
        <div class="pal-item" onclick="addField('upload')"><span class="pal-icon">🖼️</span><div class="pal-name">图片上传</div></div>
        <div class="pal-item" onclick="addField('heading')"><span class="pal-icon">📌</span><div class="pal-name">分组标题</div></div>
      </div>
      <div style="margin-top:12px;font-size:11px;color:var(--muted);line-height:1.7;">
        拖拽字段卡片可调整顺序<br>
        点击字段卡片可编辑属性<br>
        QQ / 称呼 为必填内置字段
      </div>
    </div>

    <!-- 保存 -->
    <div class="save-bar">
      <span class="unsaved" id="unsaved-tip"></span>
      <button class="btn btn-primary btn-sm" onclick="saveSchema()">💾 保存表单</button>
    </div>
  </div>
</div>

<!-- 隐藏表单 -->
<form id="save-form" method="post" action="{{ url_for('admin_form_builder') }}" style="display:none;">
  <input type="hidden" name="schema_json" id="schema_json_input">
</form>

<script>
// ── 初始数据 ──────────────────────────────────────────────────────────────────
const DEFAULT_SCHEMA = {{ schema_json|safe }};

let schema = JSON.parse(JSON.stringify(DEFAULT_SCHEMA));
let selectedId = null;
let dragSrcIdx = null;
let dirty = false;

const TYPE_LABELS = {
  builtin_name: '内置·称呼',
  builtin_qq:   '内置·QQ',
  short_text:   '单行文字',
  textarea:     '多行文字',
  radio:        '单选',
  upload:       '图片上传',
  heading:      '分组标题',
};
const TYPE_ICONS = {
  builtin_name:'👤', builtin_qq:'💬', short_text:'✏️', textarea:'📄', radio:'🔘', upload:'🖼️', heading:'📌',
};

function uid() { return '_' + Math.random().toString(36).slice(2, 9); }

// ── 渲染画布 ──────────────────────────────────────────────────────────────────
function render() {
  const canvas = document.getElementById('canvas');
  if (schema.length === 0) {
    canvas.innerHTML = '<div class="fb-empty">画布为空<br>在右侧点击组件添加字段<br>或点击「恢复默认」加载预设</div>';
    return;
  }
  canvas.innerHTML = '';
  schema.forEach((f, idx) => {
    const div = document.createElement('div');
    div.className = 'fbc' + (f.id === selectedId ? ' selected' : '');
    div.dataset.idx = idx;
    div.draggable = true;
    div.innerHTML = buildCard(f, idx);
    // drag
    div.addEventListener('dragstart', e => { dragSrcIdx = idx; div.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    div.addEventListener('dragend',   () => { div.classList.remove('dragging'); document.querySelectorAll('.fbc').forEach(c=>c.classList.remove('drag-over')); });
    div.addEventListener('dragover',  e => { e.preventDefault(); div.classList.add('drag-over'); });
    div.addEventListener('dragleave', () => div.classList.remove('drag-over'));
    div.addEventListener('drop',      e => { e.preventDefault(); div.classList.remove('drag-over'); if (dragSrcIdx !== null && dragSrcIdx !== idx) { moveField(dragSrcIdx, idx); } });
    // click to select
    div.addEventListener('click', e => {
      if (e.target.closest('.fbc-btn')) return;
      selectField(f.id);
    });
    canvas.appendChild(div);
  });
}

function buildCard(f, idx) {
  const isBuiltin = f.type === 'builtin_name' || f.type === 'builtin_qq';
  const typeLabel = TYPE_LABELS[f.type] || f.type;
  const icon = TYPE_ICONS[f.type] || '⬜';
  let preview = '';
  if (f.type === 'radio' && f.options && f.options.length) {
    preview = `<div class="fbc-opts">${f.options.map(o=>`<span class="fbc-opt">${o}</span>`).join('')}</div>`;
  }
  if (f.type === 'heading') {
    return `<div class="fbc-drag">☰</div>
      <div class="fbc-body">
        <div class="fbc-type">── 分组标题 ──</div>
        <div class="fbc-label" style="font-size:15px;">${esc(f.label)}</div>
      </div>
      <div class="fbc-actions">
        <button class="fbc-btn del" onclick="removeField('${f.id}')" title="删除">✕</button>
      </div>`;
  }
  return `<div class="fbc-drag">☰</div>
    <div class="fbc-body">
      <div class="fbc-type">${icon} ${typeLabel}</div>
      <div class="fbc-label">${esc(f.label)}${f.required ? '<span class="req">*</span>' : ''}</div>
      ${f.hint ? `<div class="fbc-hint">${esc(f.hint)}</div>` : ''}
      ${preview}
    </div>
    <div class="fbc-actions">
      ${isBuiltin
        ? '<span class="fbc-lock">固定</span>'
        : `<button class="fbc-btn" onclick="moveFieldBtn('${f.id}',-1)" title="上移">↑</button>
           <button class="fbc-btn" onclick="moveFieldBtn('${f.id}',1)" title="下移">↓</button>
           <button class="fbc-btn del" onclick="removeField('${f.id}')" title="删除">✕</button>`}
    </div>`;
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── 字段操作 ──────────────────────────────────────────────────────────────────
function addField(type) {
  const id = uid();
  const defaults = {
    short_text: { id, type, label:'新字段', required:false, placeholder:'', hint:'' },
    textarea:   { id, type, label:'新文本区', required:false, placeholder:'', hint:'' },
    radio:      { id, type, label:'单选字段', required:false, options:['选项一','选项二'], default:'' },
    upload:     { id, type, label:'图片上传', required:false, hint:'最多10张，支持 JPG/PNG/GIF/WebP' },
    heading:    { id, type, label:'分组标题' },
  };
  schema.push(defaults[type]);
  markDirty();
  render();
  selectField(id);
  // scroll to bottom
  setTimeout(()=>{ const el=document.querySelector(`.fbc[data-idx="${schema.length-1}"]`); if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'}); },50);
}

function removeField(fid) {
  if (schema.find(f=>f.id===fid) && (schema.find(f=>f.id===fid).type==='builtin_name'||schema.find(f=>f.id===fid).type==='builtin_qq')) {
    alert('QQ 和称呼是内置必填字段，不可删除');return;
  }
  schema = schema.filter(f=>f.id!==fid);
  if (selectedId === fid) { selectedId=null; closeEditor(); }
  markDirty(); render();
}

function moveField(fromIdx, toIdx) {
  const [item] = schema.splice(fromIdx,1);
  schema.splice(toIdx,0,item);
  dragSrcIdx=null; markDirty(); render();
  if (selectedId) selectField(selectedId);
}

function moveFieldBtn(fid, dir) {
  const idx = schema.findIndex(f=>f.id===fid);
  if (idx<0) return;
  const to = idx+dir;
  if (to<0||to>=schema.length) return;
  moveField(idx,to);
}

function selectField(fid) {
  selectedId = fid;
  render();
  openEditor(schema.find(f=>f.id===fid));
}

// ── 编辑器 ───────────────────────────────────────────────────────────────────
function openEditor(f) {
  if (!f) return;
  document.getElementById('editor-section').style.display='';
  document.getElementById('palette-section').style.display='none';
  const pane = document.getElementById('editor-pane');
  pane.innerHTML = buildEditor(f);
}

function closeEditor() {
  selectedId = null;
  document.getElementById('editor-section').style.display='none';
  document.getElementById('palette-section').style.display='';
  render();
}

function buildEditor(f) {
  const isBuiltin = f.type==='builtin_name'||f.type==='builtin_qq';
  const isHeading = f.type==='heading';
  let html = `
    <div class="fg">
      <label class="fl">标签文字</label>
      <input class="fi" value="${esc(f.label)}" oninput="updateField('${f.id}','label',this.value)">
    </div>`;

  if (!isBuiltin && !isHeading) {
    html += `
    <div class="fg">
      <div class="switch-row">
        <label class="fl">必填</label>
        <label class="switch">
          <input type="checkbox" ${f.required?'checked':''} onchange="updateField('${f.id}','required',this.checked)">
          <span class="slider"></span>
        </label>
      </div>
    </div>`;
  }

  if (f.type==='short_text'||f.type==='textarea'||f.type==='builtin_name'||f.type==='builtin_qq') {
    html += `
    <div class="fg">
      <label class="fl">占位提示 (placeholder)</label>
      <input class="fi" value="${esc(f.placeholder||'')}" oninput="updateField('${f.id}','placeholder',this.value)" placeholder="可留空">
    </div>`;
  }

  if (f.type!=='heading') {
    html += `
    <div class="fg">
      <label class="fl">说明文字 (hint)</label>
      <input class="fi" value="${esc(f.hint||'')}" oninput="updateField('${f.id}','hint',this.value)" placeholder="可留空">
    </div>`;
  }

  if (f.type==='radio') {
    html += `<div class="fg"><label class="fl">选项列表</label>
      <div class="opts-list" id="opts-list-${f.id}">`;
    (f.options||[]).forEach((opt,i) => {
      html += `<div class="opt-row" data-opt-idx="${i}">
        <input class="fi" value="${esc(opt)}" oninput="updateOption('${f.id}',${i},this.value)">
        <button class="fbc-btn del" onclick="removeOption('${f.id}',${i})">✕</button>
      </div>`;
    });
    html += `</div>
      <button class="add-opt-btn" onclick="addOption('${f.id}')">＋ 添加选项</button>
    </div>
    <div class="fg">
      <label class="fl">默认选中</label>
      <select class="fs" onchange="updateField('${f.id}','default',this.value)">
        <option value="">（无默认）</option>
        ${(f.options||[]).map(o=>`<option value="${esc(o)}" ${f.default===o?'selected':''}>${esc(o)}</option>`).join('')}
      </select>
    </div>`;
  }

  return html;
}

function updateField(fid, key, val) {
  const f = schema.find(f=>f.id===fid);
  if (!f) return;
  f[key] = val;
  markDirty(); render();
}

function updateOption(fid, idx, val) {
  const f = schema.find(f=>f.id===fid);
  if (!f||!f.options) return;
  f.options[idx] = val;
  markDirty(); render();
}

function addOption(fid) {
  const f = schema.find(f=>f.id===fid);
  if (!f) return;
  if (!f.options) f.options=[];
  f.options.push('新选项');
  markDirty(); render(); openEditor(f);
}

function removeOption(fid, idx) {
  const f = schema.find(f=>f.id===fid);
  if (!f||!f.options) return;
  f.options.splice(idx,1);
  if (f.default===f.options[idx]) f.default='';
  markDirty(); render(); openEditor(f);
}

// ── 保存 / 重置 ──────────────────────────────────────────────────────────────
function markDirty() {
  dirty = true;
  document.getElementById('unsaved-tip').textContent = '有未保存的更改';
}

function saveSchema() {
  document.getElementById('schema_json_input').value = JSON.stringify(schema);
  document.getElementById('save-form').submit();
}

function resetDefault() {
  if (!confirm('恢复为系统默认表单？当前设计会丢失。')) return;
  fetch('/admin/form-builder/default-schema')
    .then(r=>r.json()).then(s=>{ schema=s; dirty=false; document.getElementById('unsaved-tip').textContent=''; closeEditor(); render(); })
    .catch(()=>{ schema=JSON.parse(JSON.stringify(DEFAULT_SCHEMA)); render(); });
}

// ── 初始化 ───────────────────────────────────────────────────────────────────
render();
</script>
{% endblock %}
