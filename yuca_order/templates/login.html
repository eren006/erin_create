{% extends 'base.html' %}
{% block title %}用户登录{% endblock %}
{% block body %}
<div class="page" style="max-width:420px;">
  <div class="page-title">用户登录</div>
  {% for e in errors %}<div class="err-msg">{{ e }}</div>{% endfor %}
  <div class="card">
    <form method="post">
      <div class="fg">
        <label class="fl">所属账户 <span class="req">*</span></label>
        <select name="tenant_id" class="fs" required>
          <option value="">— 请选择 —</option>
          {% for t in tenants %}
          <option value="{{ t.id }}" {% if request.form.get('tenant_id')==t.id|string %}selected{% endif %}>
            {{ t.display_name or t.slug }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="fg">
        <label class="fl">用户名 <span class="req">*</span></label>
        <input class="fi" name="username" value="{{ request.form.get('username','') }}" autocomplete="username">
      </div>
      <div class="fg">
        <label class="fl">密码 <span class="req">*</span></label>
        <input class="fi" type="password" name="password" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%;">登录</button>
    </form>
    <div style="margin-top:14px;font-size:12px;color:var(--muted);text-align:center;">
      没有账号？<a href="{{ url_for('user_register') }}">注册</a>
      &nbsp;|&nbsp; <a href="{{ url_for('index') }}">返回首页</a>
    </div>
  </div>
</div>
{% endblock %}
