{# Painted curtain and pearls share an undistorted image; island is contained. #}
<div class="ballet-theatre ballet-only" aria-hidden="true">
  <div class="pastel-curtain pastel-curtain-left"><img src="{{ url_for('static', filename='ballet-curtain-pastel.webp') }}" alt="" width="736" height="2135"></div>
  <div class="pastel-curtain pastel-curtain-right"><img src="{{ url_for('static', filename='ballet-curtain-pastel.webp') }}" alt="" width="736" height="2135"></div>
  <svg class="theatre-story" viewBox="0 0 600 470" focusable="false">
    <defs>
      <linearGradient id="snow-gold" x2="1" y2="1"><stop stop-color="#fff1bd"/><stop offset=".4" stop-color="#b7873d"/><stop offset=".7" stop-color="#e8c579"/><stop offset="1" stop-color="#a47532"/></linearGradient>
      <radialGradient id="sweet-pink" cx=".3" cy=".25"><stop stop-color="#fff5e8"/><stop offset=".45" stop-color="#efb6c5"/><stop offset="1" stop-color="#a85475"/></radialGradient>
      <g id="snow-arm"><path d="M0 0V-15M0 -8L-5 -12M0 -8L5 -12M0 -3L-4 -7M0 -3L4 -7"/></g>
      <g id="gold-snowflake" fill="none" stroke="url(#snow-gold)" stroke-width="1.4" stroke-linecap="round"><use href="#snow-arm"/><use href="#snow-arm" transform="rotate(60)"/><use href="#snow-arm" transform="rotate(120)"/><use href="#snow-arm" transform="rotate(180)"/><use href="#snow-arm" transform="rotate(240)"/><use href="#snow-arm" transform="rotate(300)"/><circle r="2" fill="#fff0bc"/></g>
      <g id="wrapped-sweet"><path d="M-10 -4L-23 -10L-21 1L-24 10L-10 5M10 -4L23 -10L21 1L24 10L10 5" fill="#e6b9c4" stroke="#bd8a9c" stroke-width=".8"/><path d="M-20 -6L-12 0L-21 6M20 -6L12 0L21 6" fill="none" stroke="#fff2e2" stroke-width=".8"/><rect x="-13" y="-9" width="26" height="18" rx="8" fill="url(#sweet-pink)" stroke="#c5909e" stroke-width=".8"/><path d="M-5 -8L-9 7M3 -8L-1 8M10 -6L6 8" stroke="#fff0de" stroke-width="2.5" opacity=".8"/><path d="M-8 -4Q0 -8 7 -4" stroke="#fff9f1" fill="none" stroke-width="1.2"/></g>
      <g id="sugar-drop"><path d="M0 8V30" stroke="#d9b989" stroke-width="3"/><circle r="13" fill="#fbe8d8" stroke="#cb9a9d" stroke-width="1"/><path d="M0 0C-8 -4 -4 -13 5 -10C19 -4 10 14 -2 10C-19 5 -10 -17 5 -11M0 0Q5 7 8 0" fill="none" stroke="#c47992" stroke-width="2.5"/><circle cx="-4" cy="-5" r="2" fill="#fff9eb" opacity=".8"/></g>
      <linearGradient id="ribbon-silk"><stop stop-color="#e6b6c5" stop-opacity=".3"/><stop offset=".35" stop-color="#f8dce3" stop-opacity=".8"/><stop offset=".65" stop-color="#d9a1b7" stop-opacity=".45"/><stop offset="1" stop-color="#fbe8eb" stop-opacity=".65"/></linearGradient>
      <filter id="silk-breeze" x="-25%" y="-15%" width="150%" height="135%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency=".012 .025" numOctaves="1" seed="7" result="silk-noise"/>
        <feOffset in="silk-noise" dx="0" dy="0" result="silk-wave" data-silk-offset=""/>
        <feDisplacementMap in="SourceGraphic" in2="silk-wave" scale="4" xChannelSelector="R" yChannelSelector="G" data-silk-displace=""/>
      </filter>
    </defs>
    <image class="romantic-stage-art" href="{{ url_for('static', filename='ballet-island-complete.webp') }}" x="0" y="70" width="600" height="400"/>
    <g class="painted-ribbon silk-left"><image href="{{ url_for('static', filename='ballet-ribbon-silk.webp') }}" x="156" y="393" width="55" height="165" filter="url(#silk-breeze)"/></g>
    <g class="painted-ribbon silk-right"><image href="{{ url_for('static', filename='ballet-ribbon-silk.webp') }}" x="393" y="392" width="45" height="135" filter="url(#silk-breeze)"/></g>
    <g class="storybook-dancer"><image href="{{ url_for('static', filename='ballet-dancer-pastel.webp') }}" x="207" y="43" width="214" height="321"/></g>
    <image class="ballet-swan" href="{{ url_for('static', filename='ballet-swan.webp') }}" x="378" y="275" width="116" height="77"/>
    <g class="floating-snow snow-one"><svg x="154" y="81" width="39" height="39" viewBox="0 0 971 809" overflow="hidden"><image href="{{ url_for('static', filename='ballet-ornaments-pastel.webp') }}" width="1942" height="809"/></svg></g>

    <g class="floating-candy candy-one"><svg x="161" y="211" width="45" height="45" viewBox="971 0 971 809" overflow="hidden"><image href="{{ url_for('static', filename='ballet-ornaments-pastel.webp') }}" width="1942" height="809"/></svg></g>
    <g class="floating-candy candy-two"><svg x="421" y="96" width="44" height="44" viewBox="971 0 971 809" overflow="hidden"><image href="{{ url_for('static', filename='ballet-ornaments-pastel.webp') }}" width="1942" height="809"/></svg></g>
    <g class="floating-candy candy-three"><svg x="387" y="260" width="35" height="35" viewBox="971 0 971 809" overflow="hidden"><image href="{{ url_for('static', filename='ballet-ornaments-pastel.webp') }}" width="1942" height="809"/></svg></g>
  </svg>
